apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-image-tags
spec:
  validationActions:
  - Audit
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
        - ${NS_DEMO}
        - ${NS_APPLICATIONS}
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: containers
    expression: 'object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])'
  validations:
  - expression: variables.containers.all(c, c.image.matches('^.+(:[^/:@]+|@sha256:[a-fA-F0-9]{64})$')
      && !c.image.matches('^.+:latest(@.*)?$'))
    message: Use explicit non-latest image tags or immutable sha256 digests.
