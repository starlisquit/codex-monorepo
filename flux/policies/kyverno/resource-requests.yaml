apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-resource-requests
spec:
  validationActions:
  - Audit
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
        - ${NS_DEMO}
        - ${NS_APPLICATIONS}
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: containers
    expression: 'object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : [])'
  validations:
  - expression: variables.containers.all(c, has(c.resources) && has(c.resources.requests) && 'cpu' in
      c.resources.requests && 'memory' in c.resources.requests && has(c.resources.limits) && 'memory'
      in c.resources.limits)
    message: Regular and init containers need CPU/memory requests and memory limits.
