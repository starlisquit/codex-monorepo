apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-pki-issuers
spec:
  validationActions:
  - Audit
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - cert-manager.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - certificates
  validations:
  - expression: (object.spec.issuerRef.name == 'platform-workload-ca' && object.spec.issuerRef.kind
      == 'ClusterIssuer') || (object.metadata.namespace == 'certificates' && object.metadata.name
      == 'platform-root' && object.spec.issuerRef.name == 'platform-root-bootstrap')
      || (object.metadata.namespace == 'kyverno' && object.spec.issuerRef.name in
      ['kyverno-ca-issuer', 'kyverno-cleanup-ca-issuer'] && object.spec.issuerRef.kind
      == 'Issuer')
    message: Certificates must use platform-workload-ca or the explicitly designated
      PKI bootstrap/delegated issuer.
