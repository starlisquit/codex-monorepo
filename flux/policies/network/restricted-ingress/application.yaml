apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restricted-application-ingress
  namespace: applications
spec:
  podSelector:
    matchLabels:
      networking.platform/ingress: restricted
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Both selectors belong to ONE peer: namespace AND caller label must match.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: applications
      podSelector:
        matchLabels:
          networking.platform/caller: approved
    ports:
    - protocol: TCP
      port: 8080
