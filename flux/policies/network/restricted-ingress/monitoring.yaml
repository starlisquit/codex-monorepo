apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restricted-monitoring-ingress
  namespace: applications
spec:
  podSelector:
    matchLabels:
      networking.platform/ingress: restricted
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: vmagent
    ports:
    - protocol: TCP
      port: 9090
