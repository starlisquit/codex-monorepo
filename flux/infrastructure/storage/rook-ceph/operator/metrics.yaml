apiVersion: v1
kind: Service
metadata:
  name: rook-ceph-operator-metrics
  namespace: ${NS_ROOK_CEPH}
  labels:
    app: rook-ceph-operator-metrics
spec:
  selector:
    app: rook-ceph-operator
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rook-ceph-operator
  namespace: ${NS_ROOK_CEPH}
spec:
  selector:
    matchLabels:
      app: rook-ceph-operator-metrics
  endpoints:
  - port: metrics
