apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
  namespace: ${NS_ROOK_CEPH}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: rook-ceph
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: rook
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: rook-ceph-operator-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: rook-ceph-operator-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${NS_OBSERVABILITY}
