apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- helmrelease.yaml
- metrics.yaml
namespace: ${ROOK_CEPH_NAMESPACE:=rook-ceph}
configMapGenerator:
- name: rook-ceph-operator-values
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
