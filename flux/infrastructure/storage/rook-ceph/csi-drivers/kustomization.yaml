apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${ROOK_CEPH_NAMESPACE:=rook-ceph}
resources:
- helmrelease.yaml
configMapGenerator:
- name: ceph-csi-drivers-values
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
