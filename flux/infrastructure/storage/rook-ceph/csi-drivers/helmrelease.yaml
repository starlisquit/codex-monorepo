apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
  namespace: rook-ceph
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: ceph-csi-drivers
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: ceph-csi
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: ceph-csi-drivers-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: ceph-csi-drivers-cluster-values
    valuesKey: values.yaml
    optional: true
  dependsOn:
  - name: rook-ceph-operator
    namespace: rook-ceph
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
