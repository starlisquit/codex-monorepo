apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ceph-csi-drivers
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/infrastructure/storage/rook-ceph/csi-drivers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: foundation
  - name: rook-ceph-operator
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: ceph-csi-drivers
    namespace: ${ROOK_CEPH_NAMESPACE:=rook-ceph}
