apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-cluster
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/infrastructure/storage/rook-ceph/cluster
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: foundation
  - name: prometheus-operator-crds
  - name: rook-ceph-operator
  - name: ceph-certificates
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: rook-ceph-cluster
    namespace: ${ROOK_CEPH_NAMESPACE:=rook-ceph}
