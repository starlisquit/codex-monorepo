apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  suspend: true
  interval: 30m
  chart:
    spec:
      chart: rook-ceph-cluster
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: rook
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: rook-ceph-cluster-values
    valuesKey: values.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: observability
  - name: rook-ceph-operator
    namespace: rook-ceph
