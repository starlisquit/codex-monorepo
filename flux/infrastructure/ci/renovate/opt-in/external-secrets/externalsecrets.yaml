apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-credentials
  namespace: ci
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: renovate-openbao
  target:
    name: renovate-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: RENOVATE_TOKEN
    remoteRef:
      key: infrastructure/ci/renovate/credentials
      property: RENOVATE_TOKEN
