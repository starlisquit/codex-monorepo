apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: ${NS_CI}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: renovate
      version: 46.396.0
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: renovate-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: renovate-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
