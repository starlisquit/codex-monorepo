apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner
  namespace: ${NS_CI}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: gitlab-runner
      version: 0.94.2
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: gitlab-runner-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: gitlab-runner-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
