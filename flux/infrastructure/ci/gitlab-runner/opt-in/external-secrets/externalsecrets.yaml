apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-auth
  namespace: ci
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: gitlab-runner-openbao
  target:
    name: gitlab-runner-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        runner-token: '{{ index . "runner-token" }}'
        runner-registration-token: ''
  data:
  - secretKey: runner-token
    remoteRef:
      key: infrastructure/ci/gitlab-runner/auth
      property: runner-token
