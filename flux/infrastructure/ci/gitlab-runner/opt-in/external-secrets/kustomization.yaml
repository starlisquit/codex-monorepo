apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${NS_CI}
resources:
- serviceaccount.yaml
- secretstore.yaml
- externalsecrets.yaml
configMapGenerator:
- name: gitlab-runner-openbao-bootstrap
  files:
  - role.json
  - policy.hcl
generatorOptions:
  disableNameSuffixHash: true
