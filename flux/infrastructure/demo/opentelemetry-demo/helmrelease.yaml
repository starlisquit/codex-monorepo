apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-demo
  namespace: ${DEMO_NAMESPACE:=demo}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: opentelemetry-demo
      version: 0.42.6
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: opentelemetry-demo-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: opentelemetry-demo-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: victoria-metrics-k8s-stack
    namespace: ${OBSERVABILITY_NAMESPACE:=observability}
  - name: prometheus-operator-crds
    namespace: ${OBSERVABILITY_NAMESPACE:=observability}
  - name: victoria-traces-agent
    namespace: ${OBSERVABILITY_NAMESPACE:=observability}
