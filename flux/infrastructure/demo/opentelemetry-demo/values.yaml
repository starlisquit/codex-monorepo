default:
  envOverrides:
  - name: OTEL_METRICS_EXPORTER
    value: otlp
  - name: OTEL_TRACES_EXPORTER
    value: otlp
  - name: OTEL_LOGS_EXPORTER
    value: otlp
  - name: OTEL_METRIC_EXPORT_INTERVAL
    value: '10000'
  - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
    value: cumulative
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: service.version={{ .Chart.AppVersion }},service.namespace=opentelemetry-demo,deployment.environment.name=demo
components:
  accounting:
    enabled: false
  ad:
    enabled: false
  agent:
    enabled: false
  cart:
    enabled: false
  chatbot:
    enabled: false
  checkout:
    enabled: false
  currency:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  email:
    enabled: false
  fraud-detection:
    enabled: false
  frontend:
    enabled: false
  frontend-proxy:
    enabled: false
  image-provider:
    enabled: false
  load-generator:
    enabled: false
  mcp:
    enabled: false
  payment:
    enabled: false
  product-catalog:
    enabled: false
  quote:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi
  recommendation:
    enabled: false
  shipping:
    enabled: false
  flagd:
    enabled: false
  kafka:
    enabled: false
  astronomy-db:
    enabled: false
  valkey-cart:
    enabled: false
  telemetry-docs:
    enabled: false
  opamp-server:
    enabled: false
  firepit:
    enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
jaeger:
  enabled: false
opensearch:
  enabled: false
otel-ebpf-profiler:
  enabled: false
opentelemetry-collector:
  enabled: true
  mode: deployment
  replicaCount: 1
  presets:
    hostMetrics:
      enabled: false
    kubernetesAttributes:
      enabled: false
    kubeletMetrics:
      enabled: false
    clusterMetrics:
      enabled: false
    kubernetesEvents:
      enabled: false
    kubernetesObjects:
      enabled: false
    logsCollection:
      enabled: false
    annotationDiscovery:
      metrics:
        enabled: false
      logs:
        enabled: false
    profiling:
      enabled: false
    resourceDetection:
      enabled: false
  ports:
    metrics:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-grpc:
      enabled: false
    jaeger-thrift:
      enabled: false
    zipkin:
      enabled: false
    otlp:
      hostPort: null
    otlp-http:
      hostPort: null
  serviceMonitor:
    enabled: false
  alternateConfig:
    extensions:
      health_check:
        endpoint: $${env:MY_POD_IP}:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: $${env:MY_POD_IP}:4317
          http:
            endpoint: $${env:MY_POD_IP}:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch: {}
    exporters:
      otlp_http/vlagent:
        logs_endpoint: http://vlagent-victoria-metrics-k8s-stack.${OBSERVABILITY_NAMESPACE:=observability}.svc.cluster.local:9429/insert/opentelemetry/v1/logs
      otlp_http/vmagent:
        metrics_endpoint: http://vmagent-victoria-metrics-k8s-stack.${OBSERVABILITY_NAMESPACE:=observability}.svc.cluster.local:8429/opentelemetry/v1/metrics
      otlp_http/vtagent:
        traces_endpoint: http://vtagent-victoria-traces-agent.${OBSERVABILITY_NAMESPACE:=observability}.svc.cluster.local:10429/insert/opentelemetry/v1/traces
    service:
      extensions:
      - health_check
      pipelines:
        metrics:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - batch
          exporters:
          - otlp_http/vmagent
        logs:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - batch
          exporters:
          - otlp_http/vlagent
        traces:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - batch
          exporters:
          - otlp_http/vtagent
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 192Mi
  image:
    repository: docker.io/otel/opentelemetry-collector-contrib
