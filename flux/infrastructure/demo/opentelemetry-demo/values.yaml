default:
  envOverrides:
  - name: OTEL_METRICS_EXPORTER
    value: otlp
  - name: OTEL_TRACES_EXPORTER
    value: otlp
  - name: OTEL_LOGS_EXPORTER
    value: otlp
  - name: OTEL_METRIC_EXPORT_INTERVAL
    value: '10000'
  - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
    value: cumulative
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: service.version={{ .Chart.AppVersion }},service.namespace=opentelemetry-demo,deployment.environment.name=demo
components:
  load-generator:
    enabled: true
    envOverrides:
    - name: LOCUST_USERS
      value: '5'
    - name: LOCUST_AUTOSTART
      value: 'true'
prometheus:
  enabled: false
grafana:
  enabled: false
jaeger:
  enabled: false
opensearch:
  enabled: false
otel-ebpf-profiler:
  enabled: false
opentelemetry-collector:
  enabled: true
  mode: deployment
  replicaCount: 1
  presets:
    hostMetrics:
      enabled: false
    kubeletMetrics:
      enabled: false
    clusterMetrics:
      enabled: false
  ports:
    metrics:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-grpc:
      enabled: false
    jaeger-thrift:
      enabled: false
    zipkin:
      enabled: false
    otlp:
      hostPort: null
    otlp-http:
      hostPort: null
  serviceMonitor:
    enabled: false
  alternateConfig:
    connectors: {}
    exporters:
      debug: {}
      otlp_http/vlagent:
        logs_endpoint: http://vlagent-victoria-metrics-k8s-stack.observability.svc.cluster.local:9429/insert/opentelemetry/v1/logs
      otlp_http/vmagent:
        metrics_endpoint: http://vmagent-victoria-metrics-k8s-stack.observability.svc.cluster.local:8429/opentelemetry/v1/metrics
      otlp_http/vtagent:
        traces_endpoint: http://vtagent-victoria-traces-agent.observability.svc.cluster.local:10429/insert/opentelemetry/v1/traces
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      k8s_observer:
        auth_type: serviceAccount
      opamp:
        agent_description:
          include_resource_attributes: true
          non_identifying_attributes:
            demo.collector.role: gateway
            deployment.environment.name: demo
        capabilities:
          reports_available_components: true
          reports_effective_config: true
          reports_health: true
        instance_uid: 00000000-0000-7000-8000-000000000001
        server:
          ws:
            endpoint: ws://opamp-server:4320/v1/opamp
    processors:
      batch: {}
      filter/sanitize_profiles:
        error_mode: ignore
        profiles:
          profile:
          - IsMatch(resource.attributes["service.name"], "containerd-shim-.*")
      gen_ai_normalizer:
        sources:
        - name: openllmetry
      k8s_attributes:
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.pod.start_time
          - k8s.deployment.name
          - k8s.replicaset.name
          - k8s.replicaset.uid
          - k8s.daemonset.name
          - k8s.daemonset.uid
          - k8s.job.name
          - k8s.job.uid
          - k8s.container.name
          - k8s.cronjob.name
          - k8s.statefulset.name
          - k8s.statefulset.uid
          - container.image.tag
          - container.image.name
          - k8s.cluster.uid
          - service.namespace
          - service.name
          - service.version
          - service.instance.id
          otel_annotations: true
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      redaction:
        allow_all_keys: true
        blocked_key_patterns:
        - demo\.payment\.card_pin
        - password
        - secret
        ignored_keys:
        - demo.payment.card_number
        summary: info
      resource:
        attributes:
        - action: insert
          from_attribute: k8s.pod.uid
          key: service.instance.id
      resource_detection:
        detectors:
        - env
        - system
      transform/redact_sensitive_data:
        error_mode: ignore
        trace_statements:
        - context: span
          statements:
          - delete_key(attributes, "demo.payment.card_cvv") where attributes["demo.payment.card_cvv"]
            != nil
          - set(attributes["user.hash"], SHA256(attributes["user.email"])) where attributes["user.email"]
            != nil
          - delete_key(attributes, "user.email") where attributes["user.email"] !=
            nil
          - replace_pattern(attributes["demo.payment.card_number"], "^\\d{4}-\\d{4}-\\d{4}-",
            "****-****-****-") where attributes["demo.payment.card_number"] != nil
      transform/sanitize_logs:
        error_mode: ignore
        log_statements:
        - context: scope
          statements:
          - set(attributes["otelcol_signal"], attributes["otelcol.signal"]) where
            attributes["otelcol.signal"] != nil and not IsMap(attributes["otelcol.signal"])
          - delete_key(attributes, "otelcol.signal") where attributes["otelcol_signal"]
            != nil
      transform/sanitize_spans:
        error_mode: ignore
        trace_statements:
        - context: span
          statements:
          - set_semconv_span_name("1.43.0", "original_span_name")
    receivers:
      jaeger:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:14250
          thrift_compact:
            endpoint: ${env:MY_POD_IP}:6831
          thrift_http:
            endpoint: ${env:MY_POD_IP}:14268
      kafkametrics:
        brokers:
        - kafka:9092
        collection_interval: 10s
        scrapers:
        - brokers
        - topics
        - consumers
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            cors:
              allowed_headers:
              - content-type
              - traceparent
              - baggage
              allowed_origins:
              - http://*
              - https://*
            endpoint: ${env:MY_POD_IP}:4318
      prometheus:
        config:
          scrape_configs:
          - job_name: opentelemetry-collector
            scrape_interval: 10s
            static_configs:
            - targets:
              - ${env:MY_POD_IP}:8888
      prometheus/ad:
        config:
          scrape_configs:
          - job_name: ad
            scrape_interval: 10s
            static_configs:
            - targets:
              - ad:9465
      receiver_creator/metrics:
        discovery:
          enabled: true
        watch_observers:
        - k8s_observer
      zipkin:
        endpoint: ${env:MY_POD_IP}:9411
    service:
      extensions:
      - health_check
      - opamp
      - k8s_observer
      pipelines:
        logs:
          exporters:
          - otlp_http/vlagent
          processors:
          - k8s_attributes
          - memory_limiter
          - resource_detection
          - resource
          - transform/sanitize_logs
          receivers:
          - otlp
        metrics:
          exporters:
          - otlp_http/vmagent
          processors:
          - k8s_attributes
          - memory_limiter
          - resource_detection
          - resource
          receivers:
          - otlp
          - kafkametrics
          - prometheus/ad
          - receiver_creator/metrics
        traces:
          exporters:
          - otlp_http/vtagent
          processors:
          - k8s_attributes
          - memory_limiter
          - resource_detection
          - resource
          - transform/sanitize_spans
          - gen_ai_normalizer
          - transform/redact_sensitive_data
          - redaction
          receivers:
          - otlp
      telemetry:
        logs:
          processors:
          - batch:
              exporter:
                otlp:
                  endpoint: http://otel-collector:4318
                  insecure: true
                  protocol: http/protobuf
        metrics:
          level: detailed
          readers:
          - periodic:
              exporter:
                otlp:
                  endpoint: http://otel-collector:4318
                  insecure: true
                  protocol: http/protobuf
              interval: 10000
              timeout: 5000
        resource:
          host.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
