# The official demo includes hard-coded gRPC SDK exporters.
# Keep this Collector as a protocol bridge; all storage export goes through native VM agents.
default:
  envOverrides:
  - name: OTEL_METRICS_EXPORTER
    value: otlp
  - name: OTEL_TRACES_EXPORTER
    value: otlp
  - name: OTEL_LOGS_EXPORTER
    value: otlp
  - name: OTEL_METRIC_EXPORT_INTERVAL
    value: '10000'
  - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
    value: cumulative
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: service.version={{ .Chart.AppVersion }},service.namespace=opentelemetry-demo,deployment.environment.name=demo
components:
  load-generator:
    enabled: true
    envOverrides:
    - name: LOCUST_USERS
      value: '5'
    - name: LOCUST_AUTOSTART
      value: 'true'
prometheus:
  enabled: false
grafana:
  enabled: false
jaeger:
  enabled: false
opensearch:
  enabled: false
otel-ebpf-profiler:
  enabled: false
opentelemetry-collector:
  enabled: true
  mode: deployment
  replicaCount: 1
  presets:
    hostMetrics:
      enabled: false
    kubeletMetrics:
      enabled: false
    clusterMetrics:
      enabled: false
  ports:
    metrics:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-grpc:
      enabled: false
    jaeger-thrift:
      enabled: false
    zipkin:
      enabled: false
    otlp:
      hostPort: null
    otlp-http:
      hostPort: null
  serviceMonitor:
    enabled: false
  config:
    receivers:
      jaeger: null
      zipkin: null
    exporters:
      otlp_grpc/jaeger: null
      otlp_http/prometheus: null
      opensearch: null
      otlp_grpc/firepit: null
      otlp_http/vmagent:
        metrics_endpoint: http://vmagent-victoria-metrics-k8s-stack.observability.svc.cluster.local:8429/opentelemetry/v1/metrics
      otlp_http/vlagent:
        logs_endpoint: http://vlagent-victoria-metrics-k8s-stack.observability.svc.cluster.local:9429/insert/opentelemetry/v1/logs
      otlp_http/vtagent:
        traces_endpoint: http://vtagent-victoria-traces-agent.observability.svc.cluster.local:10429/insert/opentelemetry/v1/traces
    connectors:
      span_metrics: null
    service:
      pipelines:
        traces:
          receivers:
          - otlp
          exporters:
          - otlp_http/vtagent
        metrics:
          receivers:
          - otlp
          - kafkametrics
          - prometheus/ad
          exporters:
          - otlp_http/vmagent
        logs:
          exporters:
          - otlp_http/vlagent
        profiles: null
