apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: opentelemetry-demo
  namespace: demo
spec:
  instanceSelector:
    matchLabels:
      dashboards: platform
  allowCrossNamespaceImport: true
  json: "{\n  \"uid\": \"otel-demo-overview\",\n  \"title\": \"OpenTelemetry Demo / Overview\",\n  \"tags\": [\n    \"demo\",\n    \"opentelemetry\"\
    ,\n    \"grpc\"\n  ],\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"10s\",\n  \"time\": {\n    \"from\": \"now-15m\",\n \
    \   \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Spans / second by service\",\n      \"type\": \"timeseries\"\
    ,\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"datasource\": {\n \
    \       \"type\": \"prometheus\",\n        \"uid\": \"VictoriaMetrics\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"\
    A\",\n          \"expr\": \"sum by (service_name) (rate(traces_span_metrics_calls_total{service_namespace=\\\"opentelemetry-demo\\\"}[2m]))\"\
    \n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"title\": \"gRPC calls / second\",\n      \"type\": \"timeseries\",\n      \"\
    gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 8\n      },\n      \"datasource\": {\n        \"type\"\
    : \"prometheus\",\n        \"uid\": \"VictoriaMetrics\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n        \
    \  \"expr\": \"sum by (service_name, rpc_service) (rate(traces_span_metrics_calls_total{service_namespace=\\\"opentelemetry-demo\\\",rpc_system=\\\
    \"grpc\\\",span_kind=\\\"SPAN_KIND_SERVER\\\"}[2m]) or rate(traces_span_metrics_calls_total{service_namespace=\\\"opentelemetry-demo\\\",rpc_system_name=\\\
    \"grpc\\\",span_kind=\\\"SPAN_KIND_SERVER\\\"}[2m]))\"\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"title\": \"Error spans\
    \ / second\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"\
    y\": 16\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"VictoriaMetrics\"\n      },\n      \"targets\"\
    : [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (service_name) (rate(traces_span_metrics_calls_total{service_namespace=\\\
    \"opentelemetry-demo\\\",status_code=~\\\".*ERROR.*\\\"}[2m]))\"\n        }\n      ]\n    }\n  ]\n}"
