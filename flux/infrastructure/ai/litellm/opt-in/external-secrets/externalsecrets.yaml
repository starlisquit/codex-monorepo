apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-auth
  namespace: ${NS_AI}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: litellm-openbao
  target:
    name: litellm-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: master-key
    remoteRef:
      key: infrastructure/ai/litellm/auth
      property: master-key
  - secretKey: salt-key
    remoteRef:
      key: infrastructure/ai/litellm/auth
      property: salt-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-provider-credentials
  namespace: ${NS_AI}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: litellm-openbao
  target:
    name: litellm-provider-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: OPENAI_API_KEY
    remoteRef:
      key: infrastructure/ai/litellm/providers
      property: OPENAI_API_KEY
