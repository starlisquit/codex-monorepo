apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: litellm-db-server-pki
  namespace: ai
spec:
  secretName: litellm-db-server-pki
  commonName: litellm-db-rw
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    labels:
      cnpg.io/reload: ''
  usages:
  - server auth
  issuerRef:
    name: platform-workload-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
  - litellm-db-rw
  - litellm-db-rw.ai
  - litellm-db-rw.ai.svc
  - litellm-db-rw.ai.svc.cluster.local
  - litellm-db-r
  - litellm-db-r.ai
  - litellm-db-r.ai.svc
  - litellm-db-r.ai.svc.cluster.local
  - litellm-db-ro
  - litellm-db-ro.ai
  - litellm-db-ro.ai.svc
  - litellm-db-ro.ai.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: litellm-db-replication-pki
  namespace: ai
spec:
  secretName: litellm-db-replication-pki
  commonName: streaming_replica
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    labels:
      cnpg.io/reload: ''
  usages:
  - client auth
  issuerRef:
    name: platform-workload-ca
    kind: ClusterIssuer
    group: cert-manager.io
