apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: litellm-db-server-pki
  namespace: ${LITELLM_NAMESPACE:=ai}
spec:
  secretName: litellm-db-server-pki
  commonName: litellm-db-rw
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    labels:
      cnpg.io/reload: ''
  usages:
  - server auth
  issuerRef:
    name: ${CA_ISSUER_NAME}
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
  - litellm-db-rw
  - litellm-db-rw.${LITELLM_NAMESPACE:=ai}
  - litellm-db-rw.${LITELLM_NAMESPACE:=ai}.svc
  - litellm-db-rw.${LITELLM_NAMESPACE:=ai}.svc.cluster.local
  - litellm-db-r
  - litellm-db-r.${LITELLM_NAMESPACE:=ai}
  - litellm-db-r.${LITELLM_NAMESPACE:=ai}.svc
  - litellm-db-r.${LITELLM_NAMESPACE:=ai}.svc.cluster.local
  - litellm-db-ro
  - litellm-db-ro.${LITELLM_NAMESPACE:=ai}
  - litellm-db-ro.${LITELLM_NAMESPACE:=ai}.svc
  - litellm-db-ro.${LITELLM_NAMESPACE:=ai}.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: litellm-db-replication-pki
  namespace: ${LITELLM_NAMESPACE:=ai}
spec:
  secretName: litellm-db-replication-pki
  commonName: streaming_replica
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    labels:
      cnpg.io/reload: ''
  usages:
  - client auth
  issuerRef:
    name: ${CA_ISSUER_NAME}
    kind: ClusterIssuer
    group: cert-manager.io
