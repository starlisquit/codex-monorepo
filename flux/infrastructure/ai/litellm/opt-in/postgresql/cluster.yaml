apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db
  namespace: ai
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  instances: 3
  enableSuperuserAccess: false
  storage:
    storageClass: ceph-block
    size: 20Gi
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  certificates:
    serverTLSSecret: litellm-db-server-pki
    serverCASecret: litellm-db-server-pki
    replicationTLSSecret: litellm-db-replication-pki
    clientCASecret: litellm-db-replication-pki
