db:
  deployStandalone: false
  useExisting: true
  endpoint: litellm-db-rw.${NS_AI}.svc.cluster.local
  database: litellm
  url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)?sslmode=require&sslaccept=strict&sslcert=/etc/litellm-postgresql/ca.crt
  secret:
    name: litellm-db-app
    usernameKey: username
    passwordKey: password
volumes:
- name: postgresql-ca
  configMap:
    name: platform-ca
    items:
    - key: ca.crt
      path: ca.crt
volumeMounts:
- name: postgresql-ca
  mountPath: /etc/litellm-postgresql
  readOnly: true
extraEnvVars:
- name: LITELLM_SALT_KEY
  valueFrom:
    secretKeyRef:
      name: litellm-auth
      key: salt-key
migrationJob:
  enabled: true
  activeDeadlineSeconds: 600
  hooks:
    argocd:
      enabled: false
    helm:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
