apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  suspend: true
  interval: 30m
  chart:
    spec:
      chart: velero
      version: 12.2.2
      sourceRef:
        kind: HelmRepository
        name: velero
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: velero-values
    valuesKey: values.yaml
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: observability
