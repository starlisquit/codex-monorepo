apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${VELERO_NAMESPACE:=velero}
  namespace: ${VELERO_NAMESPACE:=velero}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: ${VELERO_NAMESPACE:=velero}
      version: 12.2.2
      sourceRef:
        kind: HelmRepository
        name: ${VELERO_NAMESPACE:=velero}
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: velero-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: velero-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${OBSERVABILITY_NAMESPACE:=observability}
