apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-cloud-credentials
  namespace: velero
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: velero-openbao
  target:
    name: velero-cloud-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: cloud
    remoteRef:
      key: infrastructure/velero/velero/s3
      property: cloud
