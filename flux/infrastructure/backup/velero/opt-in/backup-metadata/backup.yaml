apiVersion: velero.io/v1
kind: Backup
metadata:
  name: application-metadata-smoke
  namespace: ${VELERO_NAMESPACE:=velero}
spec:
  includedNamespaces:
  - ${DEMO_NAMESPACE:=demo}
  - ${APPLICATIONS_NAMESPACE:=applications}
  storageLocation: default
  snapshotVolumes: false
  defaultVolumesToFsBackup: false
  ttl: 24h0m0s
