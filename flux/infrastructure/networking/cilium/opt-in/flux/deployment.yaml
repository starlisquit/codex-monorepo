apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/infrastructure/networking/cilium
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: foundation
  - name: prometheus-operator-crds
  - name: platform-trust
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: cilium
    namespace: kube-system
