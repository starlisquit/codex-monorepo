apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: cilium
      version: 1.20.4
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: cilium-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: cilium-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: observability
