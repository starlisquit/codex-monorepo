# Set k8sServiceHost and k8sServicePort to the real API server endpoint before enabling.
# That endpoint must be reachable without kube-proxy (not the Kubernetes Service IP).
kubeProxyReplacement: true
hubble:
  enabled: true
  relay:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
    - dns
    - drop
    - tcp
    - flow
    - icmp
    # Includes visible gRPC traffic as HTTP/2, not gRPC status-code metrics.
    - httpV2
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
operator:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
envoy:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  enabled: true
l7Proxy: true
envoyConfig:
  enabled: true
loadBalancer:
  l7:
    backend: envoy
