cluster:
  name: ${CLUSTER_NAME:=default}
kubeProxyReplacement: true
encryption:
  enabled: true
  type: wireguard
hubble:
  enabled: true
  relay:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
    - dns
    - drop
    - tcp
    - flow
    - icmp
    - httpV2
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true
  tls:
    enabled: true
    auto:
      enabled: true
      method: certmanager
      certManagerIssuerRef:
        name: ${CA_ISSUER_NAME}
        kind: ClusterIssuer
        group: cert-manager.io
      privateKey:
        rotationPolicy: Always
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
operator:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
envoy:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  enabled: true
l7Proxy: true
envoyConfig:
  enabled: true
loadBalancer:
  l7:
    backend: envoy
