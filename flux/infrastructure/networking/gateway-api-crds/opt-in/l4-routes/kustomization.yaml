apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- tlsroutes.yaml
- tcproutes.yaml
- udproutes.yaml
patches:
- target:
    group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  patch: "apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n\
    \  name: unused\n  annotations:\n    kustomize.toolkit.fluxcd.io/substitute: disabled\n"
