apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: application-db
  namespace: databases
spec:
  instances: 3
  storage:
    storageClass: ceph-block
    size: 20Gi
  bootstrap:
    initdb:
      database: application
      owner: application
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  certificates:
    serverTLSSecret: application-db-server-pki
    serverCASecret: application-db-server-pki
    replicationTLSSecret: application-db-replication-pki
    clientCASecret: application-db-replication-pki
