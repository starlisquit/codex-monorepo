apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg-operator
  namespace: databases
spec:
  suspend: true
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: '*'
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: cloudnative-pg-operator-values
    valuesKey: values.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
