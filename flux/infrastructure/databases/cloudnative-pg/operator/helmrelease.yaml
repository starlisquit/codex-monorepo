apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg-operator
  namespace: ${DATABASES_NAMESPACE:=databases}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: cloudnative-pg-operator-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: cloudnative-pg-operator-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${OBSERVABILITY_NAMESPACE:=observability}
