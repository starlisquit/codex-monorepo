apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: ${NS_DATABASES}
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: clickhouse-operator
    namespace: flux-system
  dependsOn:
  - name: cert-manager
    namespace: ${NS_CERTIFICATES}
  valuesFrom:
  - kind: ConfigMap
    name: clickhouse-operator-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: clickhouse-operator-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
