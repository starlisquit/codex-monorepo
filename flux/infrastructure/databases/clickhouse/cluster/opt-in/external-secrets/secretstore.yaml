apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: clickhouse-openbao
  namespace: ${NS_DATABASES}
spec:
  provider:
    vault:
      server: https://openbao-active.${NS_SECRETS}.svc:8200
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: platform-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-databases-clickhouse
          serviceAccountRef:
            name: clickhouse-external-secrets
            audiences:
            - openbao
