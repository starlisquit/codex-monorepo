apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-auth
  namespace: ${NS_DATABASES}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: clickhouse-openbao
  target:
    name: clickhouse-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: password
    remoteRef:
      key: infrastructure/databases/clickhouse/auth
      property: password
