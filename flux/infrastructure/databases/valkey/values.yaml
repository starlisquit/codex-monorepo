metrics:
  enabled: true
  service:
    enabled: true
  serviceMonitor:
    enabled: true
  exporter:
    args:
    - --redis.addr=rediss://valkey.${DATABASES_NAMESPACE:=databases}.svc:6379
    - --tls-ca-cert-file=/etc/platform-ca/ca.crt
    extraVolumeMounts:
    - name: ${CA_BUNDLE_NAME}
      mountPath: /etc/platform-ca
      readOnly: true
tls:
  enabled: true
  existingSecret: valkey-tls
  serverPublicKey: tls.crt
  serverKey: tls.key
  caPublicKey: ca.crt
  requireClientCertificate: false
extraVolumes:
- name: ${CA_BUNDLE_NAME}
  configMap:
    name: ${CA_BUNDLE_NAME}
