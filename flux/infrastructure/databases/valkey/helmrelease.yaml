apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: ${NS_DATABASES}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: valkey
      version: 0.12.1
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: valkey-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: valkey-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${NS_OBSERVABILITY}
