apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: ${TRIVY_SYSTEM_NAMESPACE:=trivy-system}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: trivy-operator
      version: 0.38.1
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: trivy-operator-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: trivy-operator-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${OBSERVABILITY_NAMESPACE:=observability}
