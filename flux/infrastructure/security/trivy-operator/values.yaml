targetNamespaces: ''
operator:
  scanJobsConcurrentLimit: 2
  scanJobTimeout: 10m
  scanJobTTL: 30m
  scanSecretTTL: 30m
  scannerReportTTL: 24h
  clusterSbomCacheEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  accessGlobalSecretsAndServiceAccount: false
  metricsFindingsEnabled: true
  metricsVulnIdEnabled: false
  metricsImageInfo: false
trivyOperator:
  scanJobsInSameNamespace: false
  scanJobAffinity: &id001
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
          - key: node-role.kubernetes.io/master
            operator: DoesNotExist
  scanJobAutomountServiceAccountToken: false
trivy:
  slow: false
  timeout: 10m0s
  ignoreUnfixed: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeralStorage: 256Mi
    limits:
      cpu: '1'
      memory: 2Gi
      ephemeralStorage: 8Gi
resources:
  requests:
    cpu: 25m
    memory: 256Mi
  limits:
    memory: 1Gi
affinity: *id001
serviceMonitor:
  enabled: true
