apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
  namespace: tetragon
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: tetragon
      version: 1.8.0
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: tetragon-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: tetragon-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: observability
