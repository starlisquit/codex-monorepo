controller:
  nginxplus: false
  replicaCount: 1
  ingressClass:
    name: nginx
    create: true
    setAsDefaultIngress: false
  enableCustomResources: false
  service:
    type: NodePort
    externalTrafficPolicy: Cluster
  config:
    entries:
      proxy-connect-timeout: "10s"
      proxy-read-timeout: "300s"
      proxy-buffering: "false"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
prometheus:
  create: true
  service:
    create: true
  serviceMonitor:
    create: false
