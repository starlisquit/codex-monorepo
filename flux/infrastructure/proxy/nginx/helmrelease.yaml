apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: proxy
spec:
  interval: 30m
  timeout: 15m
  valuesFrom:
  - kind: ConfigMap
    name: nginx-values
    valuesKey: values.yaml
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: nginx-ingress
      version: 2.8.0
      sourceRef:
        kind: HelmRepository
        name: nginx
        namespace: flux-system
