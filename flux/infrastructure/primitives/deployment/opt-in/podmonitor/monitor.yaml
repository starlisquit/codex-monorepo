apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: application
  labels:
    app.kubernetes.io/name: application
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: application
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
