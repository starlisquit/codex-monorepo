apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application-env
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: application-openbao
  target:
    name: application-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: APP_PASSWORD
    remoteRef:
      key: applications/application/environment
      property: APP_PASSWORD
