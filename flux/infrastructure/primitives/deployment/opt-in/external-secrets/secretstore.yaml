apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: application-openbao
spec:
  provider:
    vault:
      server: https://openbao-active.secrets.svc:8200
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: platform-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: application-external-secrets
          serviceAccountRef:
            name: application-external-secrets
            audiences:
            - openbao
