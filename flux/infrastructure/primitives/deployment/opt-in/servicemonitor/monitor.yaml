apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: application
  labels:
    app.kubernetes.io/name: application
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: application
      app.kubernetes.io/component: metrics
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
