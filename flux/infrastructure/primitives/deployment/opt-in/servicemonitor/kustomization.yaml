apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- monitor.yaml
- service.yaml
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: application
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: application\n\
    spec:\n  template:\n    spec:\n      containers:\n      - name: application\n\
    \        ports:\n        - name: metrics\n          containerPort: 8081\n"
