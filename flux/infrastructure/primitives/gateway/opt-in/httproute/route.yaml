apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: application-http
spec:
  parentRefs:
  - name: application-gateway
    sectionName: http
  rules:
  - backendRefs:
    - name: application
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
  hostnames:
  - app.example.com
