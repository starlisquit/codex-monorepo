apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- route.yaml
patches:
- target:
    group: gateway.networking.k8s.io
    version: v1
    kind: Gateway
    name: application-gateway
  patch: "- op: add\n  path: /spec/listeners/-\n  value:\n    name: grpc\n    protocol:\
    \ HTTP\n    port: 50051\n    allowedRoutes:\n      namespaces:\n        from:\
    \ Same\n      kinds:\n      - kind: GRPCRoute\n"
