apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- route.yaml
patches:
- target:
    group: gateway.networking.k8s.io
    version: v1
    kind: Gateway
    name: application-gateway
  patch: "- op: add\n  path: /spec/listeners/-\n  value:\n    name: tls\n    protocol:\
    \ TLS\n    port: 443\n    allowedRoutes:\n      namespaces:\n        from: Same\n\
    \      kinds:\n      - kind: TLSRoute\n    tls:\n      mode: Passthrough\n"
