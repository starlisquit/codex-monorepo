apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled-task
  labels:
    app.kubernetes.io/name: scheduled-task
spec:
  schedule: '0 3 * * *'
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scheduled-task
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: task
            image: busybox:1.37.0
            command:
            - /bin/sh
            - -ec
            - date -Iseconds; echo "Replace this starter command with your scheduled task"
            resources:
              requests:
                cpu: 100m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
