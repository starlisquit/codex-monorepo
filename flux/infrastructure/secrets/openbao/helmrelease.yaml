apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: secrets
spec:
  suspend: true
  interval: 30m
  chart:
    spec:
      chart: openbao
      version: 0.30.6
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: openbao-values
    valuesKey: values.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
