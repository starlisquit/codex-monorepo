apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: secrets
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: openbao
      version: 0.30.6
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: openbao-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: openbao-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: observability
  - name: cert-manager
    namespace: certificates
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: openbao-agent-injector
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: openbao-agent-injector
          spec:
            template:
              spec:
                containers:
                - name: sidecar-injector
                  env:
                  - name: AGENT_INJECT_VAULT_CACERT_BYTES
                    valueFrom:
                      secretKeyRef:
                        name: openbao-server-tls
                        key: ca.crt
      - target:
          group: apps
          version: v1
          kind: StatefulSet
          name: openbao
        patch: |
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: openbao
          spec:
            template:
              spec:
                containers:
                - name: openbao
                  readinessProbe:
                    exec:
                      command:
                      - /bin/sh
                      - -ec
                      - bao status
