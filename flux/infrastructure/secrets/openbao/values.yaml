injector:
  metrics:
    enabled: true
  certs:
    secretName: openbao-injector-tls
  webhook:
    annotations:
      cert-manager.io/inject-ca-from: ${NS_SECRETS}/openbao-injector
server:
  # The official chart grants TokenReview rights to the OpenBao server account.
  authDelegator:
    enabled: true
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config:
        ui: true
        listener:
          tcp:
            tls_disable: false
            address: '[::]:8200'
            cluster_address: '[::]:8201'
            telemetry:
              unauthenticated_metrics_access: true
            tls_cert_file: /openbao/tls/tls.crt
            tls_key_file: /openbao/tls/tls.key
        storage:
          raft:
            path: /openbao/data
            retry_join:
            - leader_api_addr: https://openbao-active.${NS_SECRETS}.svc:8200
              leader_ca_cert_file: /openbao/tls/ca.crt
        service_registration:
          kubernetes: {}
        telemetry:
          prometheus_retention_time: 60s
          disable_hostname: true
    config: {}
    apiAddr: https://$(BAO_K8S_POD_NAME).openbao-internal.${NS_SECRETS}.svc:8200
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: ceph-block
  volumes:
  - name: server-tls
    secret:
      secretName: openbao-server-tls
      defaultMode: 288
  volumeMounts:
  - name: server-tls
    mountPath: /openbao/tls
    readOnly: true
  extraEnvironmentVars:
    BAO_CACERT: /openbao/tls/ca.crt
serverTelemetry:
  serviceMonitor:
    enabled: true
    tlsConfig:
      ca:
        secret:
          name: openbao-server-tls
          key: ca.crt
      serverName: openbao-active.${NS_SECRETS}.svc
      insecureSkipVerify: false
    port: https
    scheme: https
extraObjects:
- apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: openbao-injector
    namespace: ${NS_SECRETS}
  spec:
    secretName: openbao-injector-tls
    dnsNames:
    - openbao-agent-injector-svc
    - openbao-agent-injector-svc.${NS_SECRETS}
    - openbao-agent-injector-svc.${NS_SECRETS}.svc
    issuerRef:
      name: platform-workload-ca
      kind: ClusterIssuer
      group: cert-manager.io
- apiVersion: monitoring.coreos.com/v1
  kind: ServiceMonitor
  metadata:
    name: openbao-injector
    namespace: ${NS_SECRETS}
  spec:
    selector:
      matchLabels:
        app.kubernetes.io/name: openbao-agent-injector
        app.kubernetes.io/instance: openbao
    endpoints:
    - path: /metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: openbao-injector-tls
            key: ca.crt
        serverName: openbao-agent-injector-svc.${NS_SECRETS}.svc
        insecureSkipVerify: false
      port: https
- apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: openbao-server
    namespace: ${NS_SECRETS}
  spec:
    secretName: openbao-server-tls
    dnsNames:
    - localhost
    - openbao
    - openbao.${NS_SECRETS}
    - openbao.${NS_SECRETS}.svc
    - openbao.${NS_SECRETS}.svc.cluster.local
    - openbao-active
    - openbao-active.${NS_SECRETS}
    - openbao-active.${NS_SECRETS}.svc
    - openbao-active.${NS_SECRETS}.svc.cluster.local
    - openbao-standby
    - openbao-standby.${NS_SECRETS}
    - openbao-standby.${NS_SECRETS}.svc
    - openbao-standby.${NS_SECRETS}.svc.cluster.local
    - openbao-internal
    - openbao-internal.${NS_SECRETS}
    - openbao-internal.${NS_SECRETS}.svc
    - openbao-internal.${NS_SECRETS}.svc.cluster.local
    - openbao-ui
    - openbao-ui.${NS_SECRETS}
    - openbao-ui.${NS_SECRETS}.svc
    - openbao-ui.${NS_SECRETS}.svc.cluster.local
    - '*.openbao-internal'
    - '*.openbao-internal.${NS_SECRETS}'
    - '*.openbao-internal.${NS_SECRETS}.svc'
    - '*.openbao-internal.${NS_SECRETS}.svc.cluster.local'
    ipAddresses:
    - 127.0.0.1
    - ::1
    issuerRef:
      name: platform-workload-ca
      kind: ClusterIssuer
      group: cert-manager.io
global:
  tlsDisable: false
