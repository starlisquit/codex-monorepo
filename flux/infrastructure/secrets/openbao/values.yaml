# HA with integrated Raft storage; Consul is not required.
# The server listener remains HTTP; configure server TLS before production.
injector:
  metrics:
    enabled: true
  certs:
    secretName: openbao-injector-tls
  webhook:
    annotations:
      cert-manager.io/inject-ca-from: secrets/openbao-injector
server:
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"

          telemetry {
            unauthenticated_metrics_access = true
          }
        }

        storage "raft" {
          path = "/openbao/data"

          retry_join {
            leader_api_addr = "http://openbao-active.secrets.svc:8200"
          }
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "60s"
          disable_hostname = true
        }
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: ceph-block
serverTelemetry:
  serviceMonitor:
    enabled: true
    tlsConfig:
      insecureSkipVerify: false
extraObjects:
- apiVersion: cert-manager.io/v1
  kind: Issuer
  metadata:
    name: openbao-injector-selfsigned
    namespace: secrets
  spec:
    selfSigned: {}
- apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: openbao-injector-ca
    namespace: secrets
  spec:
    isCA: true
    commonName: openbao-injector-ca
    secretName: openbao-injector-ca
    issuerRef:
      name: openbao-injector-selfsigned
      kind: Issuer
- apiVersion: cert-manager.io/v1
  kind: Issuer
  metadata:
    name: openbao-injector-ca
    namespace: secrets
  spec:
    ca:
      secretName: openbao-injector-ca
- apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: openbao-injector
    namespace: secrets
  spec:
    secretName: openbao-injector-tls
    dnsNames:
    - openbao-agent-injector-svc
    - openbao-agent-injector-svc.secrets
    - openbao-agent-injector-svc.secrets.svc
    issuerRef:
      name: openbao-injector-ca
      kind: Issuer
- apiVersion: monitoring.coreos.com/v1
  kind: ServiceMonitor
  metadata:
    name: openbao-injector
    namespace: secrets
  spec:
    selector:
      matchLabels:
        app.kubernetes.io/name: openbao-agent-injector
        app.kubernetes.io/instance: openbao
    endpoints:
    - path: /metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: openbao-injector-tls
            key: ca.crt
        serverName: openbao-agent-injector-svc.secrets.svc
        insecureSkipVerify: false
      port: https
