injector:
  metrics:
    enabled: true
  certs:
    secretName: openbao-injector-tls
  webhook:
    annotations:
      cert-manager.io/inject-ca-from: secrets/openbao-injector
server:
  standalone:
    config: "ui = true\n\nlistener \"tcp\" {\n  tls_disable = 1\n  address = \"[::]:8200\"\n  cluster_address = \"[::]:8201\"\n  # Enable unauthenticated metrics\
      \ access (necessary for Prometheus Operator)\n  telemetry {\n    unauthenticated_metrics_access = true\n  }\n}\nstorage \"pebbledb\" {\n  path = \"/openbao/data/pebbledb\"\
      \n}\n\n# Example configuration for using auto-unseal, using Google Cloud KMS. The\n# GKMS keys must already exist, and the cluster must have a service account\n\
      # that is authorized to access GCP KMS.\n#seal \"gcpckms\" {\n#   project     = \"openbao-helm-dev\"\n#   region      = \"global\"\n#   key_ring    = \"openbao-helm-unseal-kr\"\
      \n#   crypto_key  = \"openbao-helm-unseal-key\"\n#}\n\n# Example configuration for enabling Prometheus metrics in your config.\n#telemetry {\n#  prometheus_retention_time\
      \ = \"30s\"\n#  disable_hostname = true\n#}\n\ntelemetry {\n  prometheus_retention_time = \"60s\"\n  disable_hostname = true\n}\n"
  ha:
    config: "ui = true\n\nlistener \"tcp\" {\n  tls_disable = 1\n  address = \"[::]:8200\"\n  cluster_address = \"[::]:8201\"\n  telemetry {\n    unauthenticated_metrics_access\
      \ = true\n  }\n}\nstorage \"consul\" {\n  path = \"openbao\"\n  address = \"HOST_IP:8500\"\n}\n\nservice_registration \"kubernetes\" {}\n\n# Example configuration\
      \ for using auto-unseal, using Google Cloud KMS. The\n# GKMS keys must already exist, and the cluster must have a service account\n# that is authorized to access\
      \ GCP KMS.\n#seal \"gcpckms\" {\n#   project     = \"openbao-helm-dev-246514\"\n#   region      = \"global\"\n#   key_ring    = \"openbao-helm-unseal-kr\"\n\
      #   crypto_key  = \"openbao-helm-unseal-key\"\n#}\n\n# Example configuration for enabling Prometheus metrics.\n# If you are using Prometheus Operator you can\
      \ enable a ServiceMonitor resource below.\n# You may wish to enable unauthenticated metrics in the listener block above.\n#telemetry {\n#  prometheus_retention_time\
      \ = \"30s\"\n#  disable_hostname = true\n#}\n\ntelemetry {\n  prometheus_retention_time = \"60s\"\n  disable_hostname = true\n}\n"
    raft:
      config: "ui = true\n\nlistener \"tcp\" {\n  tls_disable = 1\n  address = \"[::]:8200\"\n  cluster_address = \"[::]:8201\"\n  # Enable unauthenticated metrics\
        \ access (necessary for Prometheus Operator)\n  telemetry {\n    unauthenticated_metrics_access = true\n  }\n}\n\nstorage \"raft\" {\n  path = \"/openbao/data\"\
        \n}\n\nservice_registration \"kubernetes\" {}\n\ntelemetry {\n  prometheus_retention_time = \"60s\"\n  disable_hostname = true\n}\n"
serverTelemetry:
  serviceMonitor:
    enabled: true
    tlsConfig:
      insecureSkipVerify: false
extraObjects:
- apiVersion: cert-manager.io/v1
  kind: Issuer
  metadata:
    name: openbao-injector-selfsigned
    namespace: secrets
  spec:
    selfSigned: {}
- apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: openbao-injector-ca
    namespace: secrets
  spec:
    isCA: true
    commonName: openbao-injector-ca
    secretName: openbao-injector-ca
    issuerRef:
      name: openbao-injector-selfsigned
      kind: Issuer
- apiVersion: cert-manager.io/v1
  kind: Issuer
  metadata:
    name: openbao-injector-ca
    namespace: secrets
  spec:
    ca:
      secretName: openbao-injector-ca
- apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: openbao-injector
    namespace: secrets
  spec:
    secretName: openbao-injector-tls
    dnsNames:
    - openbao-agent-injector-svc
    - openbao-agent-injector-svc.secrets
    - openbao-agent-injector-svc.secrets.svc
    issuerRef:
      name: openbao-injector-ca
      kind: Issuer
- apiVersion: monitoring.coreos.com/v1
  kind: ServiceMonitor
  metadata:
    name: openbao-injector
    namespace: secrets
  spec:
    selector:
      matchLabels:
        app.kubernetes.io/name: openbao-agent-injector
        app.kubernetes.io/instance: openbao
    endpoints:
    - path: /metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: openbao-injector-tls
            key: ca.crt
        serverName: openbao-agent-injector-svc.secrets.svc
        insecureSkipVerify: false
      port: https
