apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: ${SECRETS_NAMESPACE:=secrets}
spec:
  provider:
    vault:
      server: https://openbao-active.${SECRETS_NAMESPACE:=secrets}.svc:8200
      path: ${OPENBAO_KV_MOUNT:=kv}
      version: v2
      caProvider:
        type: Secret
        name: openbao-server-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: ${OPENBAO_AUTH_MOUNT:=kubernetes}
          role: ${OPENBAO_AUTH_ROLE}
          serviceAccountRef:
            name: external-secrets-openbao
            audiences:
            - openbao
