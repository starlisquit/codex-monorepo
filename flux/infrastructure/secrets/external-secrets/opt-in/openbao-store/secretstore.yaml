apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: ${NS_SECRETS}
spec:
  provider:
    vault:
      server: https://openbao-active.${NS_SECRETS}.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: openbao-server-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-lab
          serviceAccountRef:
            name: external-secrets-openbao
            audiences:
            - openbao
