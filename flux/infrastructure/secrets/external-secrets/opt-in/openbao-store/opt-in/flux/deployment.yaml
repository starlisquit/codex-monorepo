apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-store
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/infrastructure/secrets/external-secrets/opt-in/openbao-store
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: foundation
  - name: openbao
  - name: external-secrets
  - name: platform-trust
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: SecretStore
    name: openbao
    namespace: ${SECRETS_NAMESPACE:=secrets}
  healthCheckExprs:
  - apiVersion: external-secrets.io/v1
    kind: SecretStore
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready'
      && c.status == 'True')
