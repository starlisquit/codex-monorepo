apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-verification
  namespace: ${NS_SECRETS}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: openbao-verification
  data:
  - secretKey: status
    remoteRef:
      key: lab/verification
      property: status
