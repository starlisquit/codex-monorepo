metrics:
  service:
    enabled: true
webhook:
  metrics:
    service:
      enabled: true
  certManager:
    enabled: true
    addInjectorAnnotations: true
    cert:
      create: true
      issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: ${CA_ISSUER_NAME}
      duration: 2160h
      renewBefore: 360h
      privateKey:
        rotationPolicy: Always
certController:
  metrics:
    service:
      enabled: true
  create: false
serviceMonitor:
  enabled: true
  renderMode: failIfMissing
