apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-ui
  namespace: ${NS_UI}
spec:
  interval: 30m
  timeout: 15m
  valuesFrom:
  - kind: ConfigMap
    name: flux-ui-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: flux-ui-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${NS_OBSERVABILITY}
  chartRef:
    kind: OCIRepository
    name: flux-operator
    namespace: flux-system
