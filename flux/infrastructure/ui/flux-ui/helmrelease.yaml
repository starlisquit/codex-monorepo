apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-ui
  namespace: ui
spec:
  suspend: true
  interval: 30m
  valuesFrom:
  - kind: ConfigMap
    name: flux-ui-values
    valuesKey: values.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: observability
  chartRef:
    kind: OCIRepository
    name: flux-operator
    namespace: flux-system
