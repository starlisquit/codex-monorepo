apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redisinsight-encryption
  namespace: ${NS_UI}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: redisinsight-openbao
  target:
    name: redisinsight-encryption
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: key
    remoteRef:
      key: infrastructure/ui/redisinsight/encryption
      property: key
