apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nui-contexts
  namespace: broker
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: nui-openbao
  target:
    name: nui-contexts
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: platform.json
    remoteRef:
      key: infrastructure/broker/nui/contexts
      property: platform.json
