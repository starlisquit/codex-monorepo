# Official chart is experimental. Pin the application instead of upstream latest.
image:
  repository: ghcr.io/nats-nui/nui
  tag: 0.10.0@sha256:879b64b2f2fa4c3298681ed0bebfbcfd80cae281ff787a10c404bbd62160d18a
  pullPolicy: IfNotPresent
podAnnotations:
  infrastructure.codex/nui-compatibility-patch: "2"
service:
  type: ClusterIP
  port: 31311
ingress:
  enabled: false
persistence:
  size: 1Gi
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
# Supply this Secret separately; connection credentials must never enter Git.
autoloadContexts: true
contextsVolume:
  name: nui-contexts
  items:
  - key: platform.json
    path: platform.json
credsVolume:
  name: nui-creds
  items: []
# Apply the pinned-image session-default fix before starting the official entrypoint.
command:
- /bin/sh
- /opt/nui-startup/start.sh
volumes:
- name: nui-startup
  configMap:
    name: nui-startup
volumeMounts:
- name: nui-startup
  mountPath: /opt/nui-startup
  readOnly: true
