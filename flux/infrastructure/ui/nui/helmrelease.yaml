apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nui
  namespace: ${BROKER_NAMESPACE:=broker}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: nui
      version: 0.1.6
      sourceRef:
        kind: HelmRepository
        name: nats-nui
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: nui-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: nui-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
