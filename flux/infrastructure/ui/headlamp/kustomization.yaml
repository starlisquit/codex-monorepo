apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${UI_NAMESPACE:=ui}
resources:
- helmrelease.yaml
configMapGenerator:
- name: headlamp-values
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
