apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: ${UI_NAMESPACE:=ui}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: headlamp
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: headlamp-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: headlamp-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
