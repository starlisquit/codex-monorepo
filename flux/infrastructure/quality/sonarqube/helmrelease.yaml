apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarqube
  namespace: quality
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: sonarqube
      version: 2026.5.1003
      sourceRef:
        kind: HelmRepository
        name: sonarqube
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: sonarqube-values
    valuesKey: values.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
