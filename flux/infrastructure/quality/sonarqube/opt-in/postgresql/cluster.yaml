apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sonarqube-postgresql
  namespace: quality
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  instances: 3
  enableSuperuserAccess: false
  storage:
    storageClass: ceph-block
    size: 20Gi
  bootstrap:
    initdb:
      database: sonarqube
      owner: sonarqube
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
