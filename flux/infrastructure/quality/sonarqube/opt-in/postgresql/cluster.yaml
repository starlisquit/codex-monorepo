apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sonarqube-postgresql
  namespace: ${NS_QUALITY}
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  instances: 3
  enableSuperuserAccess: false
  storage:
    storageClass: ceph-block
    size: 20Gi
  bootstrap:
    initdb:
      database: sonarqube
      owner: sonarqube
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  certificates:
    serverTLSSecret: sonarqube-postgresql-server-pki
    serverCASecret: sonarqube-postgresql-server-pki
    replicationTLSSecret: sonarqube-postgresql-replication-pki
    clientCASecret: sonarqube-postgresql-replication-pki
