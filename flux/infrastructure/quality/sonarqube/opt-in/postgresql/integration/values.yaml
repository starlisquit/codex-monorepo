jdbcOverwrite:
  enabled: true
  jdbcUrl: jdbc:postgresql://sonarqube-postgresql-rw.${NS_QUALITY}.svc.cluster.local:5432/sonarqube?sslmode=verify-full&sslrootcert=/opt/sonarqube/postgresql-ca/ca.crt
  jdbcUsername: sonarqube
  jdbcSecretName: sonarqube-postgresql-app
  jdbcSecretPasswordKey: password
extraVolumes:
- name: postgresql-ca
  configMap:
    name: platform-ca
    items:
    - key: ca.crt
      path: ca.crt
extraVolumeMounts:
- name: postgresql-ca
  mountPath: /opt/sonarqube/postgresql-ca
  readOnly: true
