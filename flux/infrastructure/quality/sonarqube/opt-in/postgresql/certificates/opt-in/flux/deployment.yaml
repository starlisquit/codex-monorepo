apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sonarqube-db-certificates
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/infrastructure/quality/sonarqube/opt-in/postgresql/certificates
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: foundation
  - name: platform-trust
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
  healthChecks:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    name: sonarqube-postgresql-server-pki
    namespace: ${QUALITY_NAMESPACE:=quality}
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    name: sonarqube-postgresql-replication-pki
    namespace: ${QUALITY_NAMESPACE:=quality}
  healthCheckExprs:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready'
      && c.status == 'True')
