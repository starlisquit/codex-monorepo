apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sonarqube-postgresql-server-pki
  namespace: ${NS_QUALITY}
spec:
  secretName: sonarqube-postgresql-server-pki
  commonName: sonarqube-postgresql-rw
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    labels:
      cnpg.io/reload: ''
  usages:
  - server auth
  issuerRef:
    name: platform-workload-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
  - sonarqube-postgresql-rw
  - sonarqube-postgresql-rw.${NS_QUALITY}
  - sonarqube-postgresql-rw.${NS_QUALITY}.svc
  - sonarqube-postgresql-rw.${NS_QUALITY}.svc.cluster.local
  - sonarqube-postgresql-r
  - sonarqube-postgresql-r.${NS_QUALITY}
  - sonarqube-postgresql-r.${NS_QUALITY}.svc
  - sonarqube-postgresql-r.${NS_QUALITY}.svc.cluster.local
  - sonarqube-postgresql-ro
  - sonarqube-postgresql-ro.${NS_QUALITY}
  - sonarqube-postgresql-ro.${NS_QUALITY}.svc
  - sonarqube-postgresql-ro.${NS_QUALITY}.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sonarqube-postgresql-replication-pki
  namespace: ${NS_QUALITY}
spec:
  secretName: sonarqube-postgresql-replication-pki
  commonName: streaming_replica
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    labels:
      cnpg.io/reload: ''
  usages:
  - client auth
  issuerRef:
    name: platform-workload-ca
    kind: ClusterIssuer
    group: cert-manager.io
