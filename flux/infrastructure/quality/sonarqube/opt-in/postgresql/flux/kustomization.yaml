apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../certificates/opt-in/flux
- ../opt-in/flux
- ../integration/opt-in/flux
- ../../flux
patches:
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: sonarqube
  patch: "- op: add\n  path: /spec/dependsOn/-\n  value:\n    name: sonarqube-db-integration\n"
