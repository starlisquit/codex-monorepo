apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-monitoring
  namespace: ${NS_QUALITY}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: sonarqube-openbao
  target:
    name: sonarqube-monitoring
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: passcode
    remoteRef:
      key: infrastructure/quality/sonarqube/monitoring
      property: passcode
