apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sonarqube-external-database-openbao
  namespace: ${NS_QUALITY}
spec:
  provider:
    vault:
      server: https://openbao-active.${NS_SECRETS}.svc:8200
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: platform-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-quality-sonarqube-external-database
          serviceAccountRef:
            name: sonarqube-external-database-external-secrets
            audiences:
            - openbao
