apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-database
  namespace: quality
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: sonarqube-external-database-openbao
  target:
    name: sonarqube-database
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: password
    remoteRef:
      key: infrastructure/quality/sonarqube/database
      property: password
