apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: observability
spec:
  suspend: true
  interval: 30m
  valuesFrom:
  - kind: ConfigMap
    name: grafana-operator-values
    valuesKey: values.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: grafana-operator
    namespace: flux-system
  dependsOn:
  - name: prometheus-operator-crds
    namespace: observability
