apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: ${OBSERVABILITY_NAMESPACE:=observability}
spec:
  interval: 30m
  timeout: 15m
  valuesFrom:
  - kind: ConfigMap
    name: grafana-operator-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: grafana-operator-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: grafana-operator
    namespace: flux-system
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${OBSERVABILITY_NAMESPACE:=observability}
