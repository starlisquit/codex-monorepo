apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: postgresql
  namespace: ${OBSERVABILITY_NAMESPACE:=observability}
spec:
  instanceSelector:
    matchLabels:
      dashboards: platform
  datasources:
  - inputName: DS_PROMETHEUS
    datasourceName: VictoriaMetrics
  json: |-
    {
      "uid": "platform-postgresql",
      "title": "Platform / postgresql",
      "tags": [
        "platform",
        "postgresql"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "postgresql overview",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cnpg_backends_total"
            }
          ]
        }
      ],
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ]
    }
