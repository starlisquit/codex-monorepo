apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: ${OBSERVABILITY_NAMESPACE:=observability}
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: metrics-server-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: metrics-server-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${OBSERVABILITY_NAMESPACE:=observability}
  - name: cert-manager
    namespace: ${CERTIFICATES_NAMESPACE:=certificates}
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: monitoring.coreos.com
          version: v1
          kind: ServiceMonitor
          name: metrics-server
        patch: |
          - op: replace
            path: /spec/endpoints/0/tlsConfig
            value:
              insecureSkipVerify: false
              serverName: metrics-server.${OBSERVABILITY_NAMESPACE:=observability}.svc
              ca:
                secret:
                  name: metrics-server
                  key: ca.crt
