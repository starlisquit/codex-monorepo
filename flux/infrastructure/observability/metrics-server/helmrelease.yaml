apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: observability
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: metrics-server-values
    valuesKey: values.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: observability
  - name: cert-manager
    namespace: certificates
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: monitoring.coreos.com
          version: v1
          kind: ServiceMonitor
          name: metrics-server
        patch: |
          - op: replace
            path: /spec/endpoints/0/tlsConfig
            value:
              insecureSkipVerify: false
              serverName: metrics-server.observability.svc
              ca:
                secret:
                  name: metrics-server
                  key: ca.crt
