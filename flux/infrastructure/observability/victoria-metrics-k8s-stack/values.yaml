grafana:
  enabled: true
  forceDeployDatasource: true
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: false
  plugins:
  - victoriametrics-metrics-datasource
  - victoriametrics-logs-datasource
defaultDashboards:
  enabled: true
  grafanaOperator:
    enabled: true
    spec:
      instanceSelector:
        matchLabels:
          dashboards: platform
      allowCrossNamespaceImport: false
defaultDatasources:
  grafanaOperator:
    enabled: true
    spec:
      instanceSelector:
        matchLabels:
          dashboards: platform
      allowCrossNamespaceImport: false
extraObjects:
- apiVersion: grafana.integreatly.org/v1beta1
  kind: Grafana
  metadata:
    name: platform
    namespace: '{{ .Release.Namespace }}'
    labels:
      dashboards: platform
  spec:
    external:
      url: http://{{ include "grafana.fullname" .Subcharts.grafana }}.{{ .Release.Namespace }}.svc:{{ .Values.grafana.service.port }}
      adminUser:
        name: '{{ include "grafana.fullname" .Subcharts.grafana }}'
        key: admin-user
      adminPassword:
        name: '{{ include "grafana.fullname" .Subcharts.grafana }}'
        key: admin-password
vmagent:
  enabled: true
  spec:
    selectAllByDefault: true
victoria-metrics-operator:
  operator:
    disable_prometheus_converter: false
prometheus-node-exporter:
  enabled: true
  vmScrape:
    enabled: true
kube-state-metrics:
  enabled: true
  vmScrape:
    enabled: true
vlsingle:
  enabled: true
  spec:
    retentionPeriod: 7d
    storage:
      storageClassName: ceph-block
      resources:
        requests:
          storage: 10Gi
vtsingle:
  enabled: true
  spec:
    retentionPeriod: 7d
    storage:
      storageClassName: ceph-block
      resources:
        requests:
          storage: 10Gi
