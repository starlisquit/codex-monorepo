grafana:
  enabled: true
  forceDeployDatasource: true
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: false
  plugins:
  - victoriametrics-metrics-datasource
  - victoriametrics-logs-datasource
defaultDashboards:
  enabled: true
  grafanaOperator:
    enabled: true
    spec:
      instanceSelector:
        matchLabels:
          dashboards: platform
      allowCrossNamespaceImport: false
defaultDatasources:
  grafanaOperator:
    enabled: true
    spec:
      instanceSelector:
        matchLabels:
          dashboards: platform
      allowCrossNamespaceImport: false
extraObjects:
- apiVersion: grafana.integreatly.org/v1beta1
  kind: Grafana
  metadata:
    name: platform
    namespace: '{{ .Release.Namespace }}'
    labels:
      dashboards: platform
  spec:
    external:
      url: http://{{ include "grafana.fullname" .Subcharts.grafana }}.{{ .Release.Namespace
        }}.svc:{{ .Values.grafana.service.port }}
      adminUser:
        name: '{{ include "grafana.fullname" .Subcharts.grafana }}'
        key: admin-user
      adminPassword:
        name: '{{ include "grafana.fullname" .Subcharts.grafana }}'
        key: admin-password
vmagent:
  enabled: true
  spec:
    selectAllByDefault: true
victoria-metrics-operator:
  operator:
    disable_prometheus_converter: false
  admissionWebhooks:
    certManager:
      enabled: true
      issuer:
        name: ${CA_ISSUER_NAME}
        kind: ClusterIssuer
      cert:
        duration: 2160h
prometheus-node-exporter:
  enabled: true
  vmScrape:
    enabled: true
kube-state-metrics:
  enabled: true
  vmScrape:
    enabled: true
vlsingle:
  enabled: true
  spec:
    retentionPeriod: 7d
    storage:
      storageClassName: ceph-block
      resources:
        requests:
          storage: 10Gi
vtsingle:
  enabled: true
  spec:
    retentionPeriod: 7d
    storage:
      storageClassName: ceph-block
      resources:
        requests:
          storage: 10Gi
vlagent:
  enabled: true
  spec:
    k8sCollector:
      enabled: true
      includePodLabels: true
      includePodAnnotations: false
      includeNodeLabels: false
      includeNodeAnnotations: false
    tmpDataPath: /var/lib/vlagent-data
    volumes:
    - name: collector-data
      hostPath:
        path: /var/lib/vlagent-data
        type: DirectoryOrCreate
    volumeMounts:
    - name: collector-data
      mountPath: /var/lib/vlagent-data
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    extraArgs:
      remoteWrite.maxDiskUsagePerURL: 128MiB
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
