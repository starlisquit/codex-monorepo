apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-traces-agent
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: victoria-traces-agent
      version: 0.2.1
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: victoria-traces-agent-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: victoria-traces-agent-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: observability
  - name: victoria-metrics-k8s-stack
    namespace: observability
