apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: disallow-privileged
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - applications
    validate:
      message: Workload does not satisfy disallow-privileged
      pattern:
        spec:
          containers:
          - name: '*'
            =(securityContext):
              =(privileged): false
