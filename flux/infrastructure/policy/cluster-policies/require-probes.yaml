apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: require-probes
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - applications
    validate:
      message: Workload does not satisfy require-probes
      pattern:
        spec:
          containers:
          - name: '*'
            readinessProbe: {}
            livenessProbe: {}
