apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openbao
  namespace: applications
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: secrets
      podSelector:
        matchLabels:
          app.kubernetes.io/name: openbao
    ports:
    - protocol: TCP
      port: 8200
