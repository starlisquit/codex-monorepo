admissionController:
  metricsService:
    create: true
  serviceMonitor:
    enabled: true
  createSelfSignedCert: false
  certManager:
    enabled: true
    createSelfSignedIssuer: false
    issuerRef:
      name: ${CA_ISSUER_NAME}
      kind: ClusterIssuer
      group: cert-manager.io
    ca:
      duration: 8760h
      renewBefore: 720h
    tls:
      duration: 2160h
      renewBefore: 360h
backgroundController:
  metricsService:
    create: true
  serviceMonitor:
    enabled: true
cleanupController:
  metricsService:
    create: true
  serviceMonitor:
    enabled: true
  createSelfSignedCert: false
  certManager:
    enabled: true
    createSelfSignedIssuer: false
    issuerRef:
      name: ${CA_ISSUER_NAME}
      kind: ClusterIssuer
      group: cert-manager.io
    ca:
      duration: 8760h
      renewBefore: 720h
    tls:
      duration: 2160h
      renewBefore: 360h
reportsController:
  metricsService:
    create: true
  serviceMonitor:
    enabled: true
