apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  suspend: true
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: '*'
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: kyverno-values
    valuesKey: values.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
