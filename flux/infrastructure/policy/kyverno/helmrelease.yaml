apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${KYVERNO_NAMESPACE:=kyverno}
  namespace: ${KYVERNO_NAMESPACE:=kyverno}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: ${KYVERNO_NAMESPACE:=kyverno}
      version: 3.9.2
      sourceRef:
        kind: HelmRepository
        name: ${KYVERNO_NAMESPACE:=kyverno}
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: kyverno-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: kyverno-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${OBSERVABILITY_NAMESPACE:=observability}
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: cert-manager.io
          version: v1
          kind: Certificate
          name: kyverno-admission-controller-ca
        patch: |
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: kyverno-admission-controller-ca
          $patch: delete
      - target:
          group: cert-manager.io
          version: v1
          kind: Issuer
          name: kyverno-ca-issuer
        patch: |
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: kyverno-ca-issuer
          $patch: delete
      - target:
          group: cert-manager.io
          version: v1
          kind: Certificate
          name: kyverno-admission-controller-tls
        patch: |
          - op: replace
            path: /spec/issuerRef
            value:
              name: ${CA_ISSUER_NAME}
              kind: ClusterIssuer
              group: cert-manager.io
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kyverno-admission-controller
        patch: |
          - op: replace
            path: /spec/template/spec/containers/0/args/0
            value: --caSecretName=kyverno-platform-ca
      - target:
          group: cert-manager.io
          version: v1
          kind: Certificate
          name: kyverno-cleanup-controller-ca
        patch: |
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: kyverno-cleanup-controller-ca
          $patch: delete
      - target:
          group: cert-manager.io
          version: v1
          kind: Issuer
          name: kyverno-cleanup-ca-issuer
        patch: |
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: kyverno-cleanup-ca-issuer
          $patch: delete
      - target:
          group: cert-manager.io
          version: v1
          kind: Certificate
          name: kyverno-cleanup-controller-tls
        patch: |
          - op: replace
            path: /spec/issuerRef
            value:
              name: ${CA_ISSUER_NAME}
              kind: ClusterIssuer
              group: cert-manager.io
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kyverno-cleanup-controller
        patch: |
          - op: replace
            path: /spec/template/spec/containers/0/args/0
            value: --caSecretName=kyverno-platform-ca
