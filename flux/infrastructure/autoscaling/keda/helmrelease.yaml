apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: ${NS_AUTOSCALING}
spec:
  interval: 30m
  timeout: 15m
  valuesFrom:
  - kind: ConfigMap
    name: keda-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: keda-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${NS_OBSERVABILITY}
  chart:
    spec:
      chart: keda
      version: 2.21.0
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: flux-system
