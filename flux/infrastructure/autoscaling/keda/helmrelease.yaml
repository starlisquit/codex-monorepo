apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: autoscaling
spec:
  interval: 30m
  valuesFrom:
  - kind: ConfigMap
    name: keda-values
    valuesKey: values.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: observability
  chart:
    spec:
      chart: keda
      version: 2.21.0
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: flux-system
