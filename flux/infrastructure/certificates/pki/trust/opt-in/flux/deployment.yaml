apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-trust
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/infrastructure/certificates/pki/trust
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: foundation
  - name: platform-issuer
  - name: trust-manager
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
  healthChecks:
  - apiVersion: trust.cert-manager.io/v1alpha1
    kind: Bundle
    name: ${CA_BUNDLE_NAME}
  - apiVersion: trust.cert-manager.io/v1alpha1
    kind: Bundle
    name: kyverno-platform-ca
  healthCheckExprs:
  - apiVersion: trust.cert-manager.io/v1alpha1
    kind: Bundle
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Synced'
      && c.status == 'True')
