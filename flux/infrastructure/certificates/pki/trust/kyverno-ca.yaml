apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: kyverno-platform-ca
spec:
  sources:
  - secret:
      name: ${CA_CERT_NAME}
      key: tls.crt
  target:
    secret:
      key: tls.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ${KYVERNO_NAMESPACE:=kyverno}
