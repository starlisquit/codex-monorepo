apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-tls
  namespace: ${NS_BROKER}
spec:
  secretName: nats-tls
  commonName: nats.${NS_BROKER}.svc
  dnsNames:
  - nats
  - nats.${NS_BROKER}
  - nats.${NS_BROKER}.svc
  - nats.${NS_BROKER}.svc.cluster.local
  - nats-headless
  - nats-headless.${NS_BROKER}
  - nats-headless.${NS_BROKER}.svc
  - nats-headless.${NS_BROKER}.svc.cluster.local
  - '*.nats-headless'
  - '*.nats-headless.${NS_BROKER}'
  - '*.nats-headless.${NS_BROKER}.svc'
  - '*.nats-headless.${NS_BROKER}.svc.cluster.local'
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  usages:
  - server auth
  - client auth
  issuerRef:
    name: platform-workload-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: valkey-tls
  namespace: ${NS_DATABASES}
spec:
  secretName: valkey-tls
  commonName: valkey.${NS_DATABASES}.svc
  dnsNames:
  - valkey
  - valkey.${NS_DATABASES}
  - valkey.${NS_DATABASES}.svc
  - valkey.${NS_DATABASES}.svc.cluster.local
  - localhost
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  usages:
  - server auth
  issuerRef:
    name: platform-workload-ca
    kind: ClusterIssuer
    group: cert-manager.io
  ipAddresses:
  - 127.0.0.1
  - ::1
