apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-tls
  namespace: ${BROKER_NAMESPACE:=broker}
spec:
  secretName: nats-tls
  commonName: nats.${BROKER_NAMESPACE:=broker}.svc
  dnsNames:
  - nats
  - nats.${BROKER_NAMESPACE:=broker}
  - nats.${BROKER_NAMESPACE:=broker}.svc
  - nats.${BROKER_NAMESPACE:=broker}.svc.cluster.local
  - nats-headless
  - nats-headless.${BROKER_NAMESPACE:=broker}
  - nats-headless.${BROKER_NAMESPACE:=broker}.svc
  - nats-headless.${BROKER_NAMESPACE:=broker}.svc.cluster.local
  - '*.nats-headless'
  - '*.nats-headless.${BROKER_NAMESPACE:=broker}'
  - '*.nats-headless.${BROKER_NAMESPACE:=broker}.svc'
  - '*.nats-headless.${BROKER_NAMESPACE:=broker}.svc.cluster.local'
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  usages:
  - server auth
  - client auth
  issuerRef:
    name: ${CA_ISSUER_NAME}
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: valkey-tls
  namespace: ${DATABASES_NAMESPACE:=databases}
spec:
  secretName: valkey-tls
  commonName: valkey.${DATABASES_NAMESPACE:=databases}.svc
  dnsNames:
  - valkey
  - valkey.${DATABASES_NAMESPACE:=databases}
  - valkey.${DATABASES_NAMESPACE:=databases}.svc
  - valkey.${DATABASES_NAMESPACE:=databases}.svc.cluster.local
  - localhost
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  usages:
  - server auth
  issuerRef:
    name: ${CA_ISSUER_NAME}
    kind: ClusterIssuer
    group: cert-manager.io
  ipAddresses:
  - 127.0.0.1
  - ::1
