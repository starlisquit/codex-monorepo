apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgresql-certificates
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/infrastructure/certificates/pki/postgresql
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: foundation
  - name: platform-trust
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
  healthChecks:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    name: application-db-server-pki
    namespace: ${DATABASES_NAMESPACE:=databases}
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    name: application-db-replication-pki
    namespace: ${DATABASES_NAMESPACE:=databases}
  healthCheckExprs:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready'
      && c.status == 'True')
