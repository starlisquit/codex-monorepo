apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: application-db-server-pki
  namespace: ${NS_DATABASES}
spec:
  secretName: application-db-server-pki
  commonName: application-db-rw
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    labels:
      cnpg.io/reload: ''
  usages:
  - server auth
  issuerRef:
    name: platform-workload-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
  - application-db-rw
  - application-db-rw.${NS_DATABASES}
  - application-db-rw.${NS_DATABASES}.svc
  - application-db-rw.${NS_DATABASES}.svc.cluster.local
  - application-db-r
  - application-db-r.${NS_DATABASES}
  - application-db-r.${NS_DATABASES}.svc
  - application-db-r.${NS_DATABASES}.svc.cluster.local
  - application-db-ro
  - application-db-ro.${NS_DATABASES}
  - application-db-ro.${NS_DATABASES}.svc
  - application-db-ro.${NS_DATABASES}.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: application-db-replication-pki
  namespace: ${NS_DATABASES}
spec:
  secretName: application-db-replication-pki
  commonName: streaming_replica
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    labels:
      cnpg.io/reload: ''
  usages:
  - client auth
  issuerRef:
    name: platform-workload-ca
    kind: ClusterIssuer
    group: cert-manager.io
