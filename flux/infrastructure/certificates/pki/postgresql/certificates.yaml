apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: application-db-server-pki
  namespace: ${DATABASES_NAMESPACE:=databases}
spec:
  secretName: application-db-server-pki
  commonName: application-db-rw
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    labels:
      cnpg.io/reload: ''
  usages:
  - server auth
  issuerRef:
    name: ${CA_ISSUER_NAME}
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
  - application-db-rw
  - application-db-rw.${DATABASES_NAMESPACE:=databases}
  - application-db-rw.${DATABASES_NAMESPACE:=databases}.svc
  - application-db-rw.${DATABASES_NAMESPACE:=databases}.svc.cluster.local
  - application-db-r
  - application-db-r.${DATABASES_NAMESPACE:=databases}
  - application-db-r.${DATABASES_NAMESPACE:=databases}.svc
  - application-db-r.${DATABASES_NAMESPACE:=databases}.svc.cluster.local
  - application-db-ro
  - application-db-ro.${DATABASES_NAMESPACE:=databases}
  - application-db-ro.${DATABASES_NAMESPACE:=databases}.svc
  - application-db-ro.${DATABASES_NAMESPACE:=databases}.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: application-db-replication-pki
  namespace: ${DATABASES_NAMESPACE:=databases}
spec:
  secretName: application-db-replication-pki
  commonName: streaming_replica
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    labels:
      cnpg.io/reload: ''
  usages:
  - client auth
  issuerRef:
    name: ${CA_ISSUER_NAME}
    kind: ClusterIssuer
    group: cert-manager.io
