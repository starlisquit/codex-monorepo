apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: platform-root-bootstrap
  namespace: ${CERTIFICATES_NAMESPACE:=certificates}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-root
  namespace: ${CERTIFICATES_NAMESPACE:=certificates}
spec:
  isCA: true
  commonName: "${CA_COMMON_NAME}"
  secretName: ${CA_CERT_NAME}
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Never
  issuerRef:
    name: platform-root-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ${CA_ISSUER_NAME}
spec:
  ca:
    secretName: ${CA_CERT_NAME}
