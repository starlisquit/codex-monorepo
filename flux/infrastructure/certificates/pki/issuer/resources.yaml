apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: platform-root-bootstrap
  namespace: certificates
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-root
  namespace: certificates
spec:
  isCA: true
  commonName: openbao-injector-ca
  secretName: platform-root-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Never
  issuerRef:
    name: platform-root-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-workload-ca
spec:
  ca:
    secretName: platform-root-ca
