apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-issuer
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/infrastructure/certificates/pki/issuer
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: foundation
  - name: cert-manager
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
  healthChecks:
  - apiVersion: cert-manager.io/v1
    kind: Issuer
    name: platform-root-bootstrap
    namespace: ${CERTIFICATES_NAMESPACE:=certificates}
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    name: platform-root
    namespace: ${CERTIFICATES_NAMESPACE:=certificates}
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    name: ${CA_ISSUER_NAME}
  healthCheckExprs:
  - apiVersion: cert-manager.io/v1
    kind: Issuer
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready'
      && c.status == 'True')
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready'
      && c.status == 'True')
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready'
      && c.status == 'True')
