apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: ${CERTIFICATES_NAMESPACE:=certificates}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: trust-manager
      version: v0.26.0
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: trust-manager-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: trust-manager-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${OBSERVABILITY_NAMESPACE:=observability}
  - name: cert-manager
    namespace: ${CERTIFICATES_NAMESPACE:=certificates}
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: cert-manager.io
          version: v1
          kind: Certificate
          name: trust-manager
        patch: |
          - op: replace
            path: /spec/issuerRef
            value:
              name: ${CA_ISSUER_NAME}
              kind: ClusterIssuer
              group: cert-manager.io
      - target:
          group: cert-manager.io
          version: v1
          kind: Issuer
          name: trust-manager
        patch: |
          $patch: delete
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: trust-manager
            namespace: ${CERTIFICATES_NAMESPACE:=certificates}
