apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: certificates
spec:
  suspend: true
  interval: 30m
  chart:
    spec:
      chart: trust-manager
      version: v0.26.0
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: trust-manager-values
    valuesKey: values.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: observability
  - name: cert-manager
    namespace: certificates
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: cert-manager.io
          version: v1
          kind: Certificate
          name: trust-manager
        patch: "- op: replace\n  path: /spec/issuerRef\n  value:\n    name: platform-workload-ca\n\
          \    kind: ClusterIssuer\n    group: cert-manager.io\n"
      - target:
          group: cert-manager.io
          version: v1
          kind: Issuer
          name: trust-manager
        patch: "$patch: delete\napiVersion: cert-manager.io/v1\nkind: Issuer\nmetadata:\n\
          \  name: trust-manager\n  namespace: certificates\n"
