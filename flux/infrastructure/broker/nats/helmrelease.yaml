apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: broker
spec:
  suspend: true
  interval: 30m
  chart:
    spec:
      chart: nats
      version: 2.15.2
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: nats-values
    valuesKey: values.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
