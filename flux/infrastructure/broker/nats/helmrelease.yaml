apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: ${BROKER_NAMESPACE:=broker}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: nats
      version: 2.15.2
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: nats-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: nats-cluster-values
    valuesKey: values.yaml
    optional: true
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
  - name: prometheus-operator-crds
    namespace: ${OBSERVABILITY_NAMESPACE:=observability}
