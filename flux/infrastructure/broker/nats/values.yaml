config:
  cluster:
    enabled: true
    replicas: 3
    tls:
      enabled: true
      secretName: nats-tls
      merge:
        verify: true
  jetstream:
    enabled: true
    fileStore:
      pvc:
        enabled: true
        size: 10Gi
        storageClassName: ceph-block
  nats:
    tls:
      enabled: true
      secretName: nats-tls
promExporter:
  enabled: true
  podMonitor:
    enabled: true
tlsCA:
  enabled: true
  configMapName: ${CA_BUNDLE_NAME}
  key: ca.crt
natsBox:
  contexts:
    default:
      merge:
        url: tls://nats.${BROKER_NAMESPACE:=broker}.svc:4222
