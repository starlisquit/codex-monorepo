apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: broker
resources:
- namespace.yaml
- helmrelease.yaml
configMapGenerator:
- name: nui-values
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
