apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: demo-sdk-overview
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: platform
  datasources:
  - inputName: DS_PROMETHEUS
    datasourceName: VictoriaMetrics
  json: |
    {
      "uid": "demo-sdk-overview",
      "title": "Demo / SDK and workload health",
      "description": "Minimal currency and quote demo. No automatic traffic generator. OTLP resource labels retain dotted names; quotes counter was verified live. Empty application panels can mean no recent traffic.",
      "tags": [
        "platform",
        "gitops"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "VictoriaMetrics",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "Quote counter",
          "description": "Observed cumulative SDK counter. Restarts reset it; this is not a durable business total.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum({__name__=\"quotes\", \"service.name\"=\"quote\"})",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 2,
          "title": "Quotes per second",
          "description": "Requires multiple exported samples; send requests to POST /getquote.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate({__name__=\"quotes\", \"service.name\"=\"quote\"}[$__rate_interval]))",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "title": "Available replicas",
          "description": "Expected: one each for currency, quote, and otel-collector.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"demo\"}",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "title": "CPU usage",
          "description": "cAdvisor usage of the demo containers.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"demo\",container!=\"\",container!=\"POD\"}[$__rate_interval]))",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "title": "Memory working set",
          "description": "Compare with memory limits; not identical to process RSS.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod, container) (container_memory_working_set_bytes{namespace=\"demo\",container!=\"\",container!=\"POD\"})",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "title": "Container restarts over selected range",
          "description": "Includes restarts from Collector memory pressure or application failures.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace=\"demo\"}[$__range]))",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
