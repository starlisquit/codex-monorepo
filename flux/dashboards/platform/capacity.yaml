apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: platform-capacity-pressure
  namespace: ${NS_OBSERVABILITY}
spec:
  instanceSelector:
    matchLabels:
      dashboards: platform
  datasources:
  - inputName: DS_PROMETHEUS
    datasourceName: VictoriaMetrics
  json: |
    {
      "uid": "platform-capacity-pressure",
      "title": "Platform / Capacity and pressure",
      "description": "Watch control-plane headroom separately from workers. Requested memory is a scheduling budget, not actual consumption.",
      "tags": [
        "platform",
        "gitops"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "VictoriaMetrics",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "Node memory used",
          "description": "MemAvailable includes reclaimable memory; not identical to kubectl top.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 2,
          "title": "Requested memory / allocatable",
          "description": "Approximate budget: regular-container requests only, without init-container maxima or Pod overhead.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"memory\",unit=\"byte\"}) / sum by (node) (kube_node_status_allocatable{resource=\"memory\",unit=\"byte\"})",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "title": "Root filesystem available",
          "description": "The 20 GiB root disks can fill independently of Ceph storage.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"}",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "title": "Node pressure conditions",
          "description": "Zero is healthy; one means a node pressure condition is active.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_node_status_condition{condition=~\"MemoryPressure|DiskPressure|PIDPressure\",status=\"true\"}",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "title": "Pending Pods by namespace",
          "description": "Inspect Pod events to distinguish scheduling, volumes, and image pulls.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (kube_pod_status_phase{phase=\"Pending\"})",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "title": "CPU I/O wait",
          "description": "Sustained wait can indicate disk bottlenecks even with low CPU utilization.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg by (instance) (rate(node_cpu_seconds_total{mode=\"iowait\"}[$__rate_interval]))",
              "legendFormat": "{{namespace}} {{pod}} {{container}} {{node}} {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
