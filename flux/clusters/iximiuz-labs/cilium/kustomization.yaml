apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/networking/cilium
- source.yaml
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: cilium
  patch: |
    - op: replace
      path: /spec/suspend
      value: false
    - op: remove
      path: /spec/dependsOn
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: cilium-cluster-values
        valuesKey: values.yaml
configMapGenerator:
- name: cilium-cluster-values
  namespace: kube-system
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
