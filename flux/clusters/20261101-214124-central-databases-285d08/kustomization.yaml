apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- flux-system
- infrastructure.yaml
- ../../infrastructure/certificates/pki/opt-in/flux
- ../../infrastructure/databases/cloudnative-pg/operator/opt-in/flux
- ../../infrastructure/ai/litellm/opt-in/postgresql/flux
- ../../infrastructure/quality/sonarqube/opt-in/postgresql/flux
patches:
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: litellm-db
  patch: "- op: replace\n  path: /spec/path\n  value: ./flux/clusters/20261101-214124-central-databases-285d08/litellm-db\n"
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: sonarqube-db
  patch: "- op: replace\n  path: /spec/path\n  value: ./flux/clusters/20261101-214124-central-databases-285d08/sonarqube-db\n"
