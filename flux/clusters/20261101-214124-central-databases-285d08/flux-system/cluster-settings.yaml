apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  CLUSTER_NAME: central-databases
  CA_CERT_NAME: database-root-key
  CA_ISSUER_NAME: database-workload-ca
  CA_BUNDLE_NAME: database-ca
  CA_COMMON_NAME: Database Validation Root
  CERTIFICATES_NAMESPACE: database-pki
  OBSERVABILITY_NAMESPACE: database-metrics
  DATABASES_NAMESPACE: database-operators
  LITELLM_NAMESPACE: llm
  QUALITY_NAMESPACE: quality-apps
  STORAGE_CLASS: local-path
  LITELLM_DB_INSTANCES: '2'
  SONARQUBE_DB_INSTANCES: '2'
