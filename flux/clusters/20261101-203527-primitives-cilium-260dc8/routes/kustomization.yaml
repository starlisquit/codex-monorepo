apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/primitives/gateway
namespace: demo
namePrefix: edge-
components:
- ../../../infrastructure/primitives/gateway/opt-in/httproute
- ../../../infrastructure/primitives/gateway/opt-in/grpcroute
- ../../../infrastructure/primitives/gateway/opt-in/tlsroute
- ../../../infrastructure/primitives/gateway/opt-in/tcproute
- ../../../infrastructure/primitives/gateway/opt-in/udproute
patches:
- target:
    kind: Gateway
  patch: "- op: replace\n  path: /spec/listeners/0/port\n  value: 18080\n- op: replace\n\
    \  path: /spec/listeners/1/port\n  value: 15051\n- op: replace\n  path: /spec/listeners/2/port\n\
    \  value: 18443\n- op: replace\n  path: /spec/listeners/3/port\n  value: 15432\n\
    - op: replace\n  path: /spec/listeners/4/port\n  value: 15353\n"
