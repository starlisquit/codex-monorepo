apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-203527-primitives-cilium-260dc8/foundation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-203527-primitives-cilium-260dc8/cilium
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
  - name: foundation
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: cilium
    namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: protocol-backends
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-203527-primitives-cilium-260dc8/backends
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
  - name: cilium
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: application
    namespace: demo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-routes
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-203527-primitives-cilium-260dc8/routes
