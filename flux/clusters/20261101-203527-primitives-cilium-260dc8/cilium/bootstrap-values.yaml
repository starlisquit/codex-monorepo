kubeProxyReplacement: true
encryption:
  enabled: false
  type: wireguard
hubble:
  enabled: false
  relay:
    enabled: false
    prometheus:
      enabled: false
      serviceMonitor:
        enabled: false
  ui:
    enabled: false
  metrics:
    enabled: []
    enableOpenMetrics: true
    serviceMonitor:
      enabled: false
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
  secretsNamespace:
    name: kube-system
    create: false
  hostNetwork:
    enabled: false
prometheus:
  enabled: false
  serviceMonitor:
    enabled: false
    trustCRDsExist: true
operator:
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false
  replicas: 1
envoy:
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false
  enabled: true
l7Proxy: true
envoyConfig:
  enabled: true
loadBalancer:
  l7:
    backend: envoy
k8sServiceHost: 172.16.0.2
k8sServicePort: 6443
