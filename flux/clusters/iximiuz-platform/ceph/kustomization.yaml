apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/storage/rook-ceph/cluster
configMapGenerator:
- name: rook-ceph-cluster-cluster-values
  namespace: rook-ceph
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
