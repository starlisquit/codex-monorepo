apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/storage/rook-ceph/cluster
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: rook-ceph-cluster
  patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ rook-ceph-cluster\n  namespace: rook-ceph\nspec:\n  suspend: false\n  timeout:\
    \ 15m\n"
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: rook-ceph-cluster
  patch: "- op: add\n  path: /spec/valuesFrom/-\n  value:\n    kind: ConfigMap\n \
    \   name: rook-ceph-cluster-cluster-values\n    valuesKey: values.yaml\n"
configMapGenerator:
- name: rook-ceph-cluster-cluster-values
  namespace: rook-ceph
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
