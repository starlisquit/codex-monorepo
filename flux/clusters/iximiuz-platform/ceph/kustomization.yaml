apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/storage/rook-ceph/cluster
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: rook-ceph-cluster
  patch: |
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: rook-ceph-cluster-cluster-values
        valuesKey: values.yaml
configMapGenerator:
- name: rook-ceph-cluster-cluster-values
  namespace: rook-ceph
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
