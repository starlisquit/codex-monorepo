toolbox:
  enabled: true
cephFileSystems: []
cephObjectStores: []
cephClusterSpec:
  mon:
    count: 3
  mgr:
    count: 1
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
    - name: cplane-01
      devices:
      - name: vdb
    - name: node-01
      devices:
      - name: vdb
    - name: node-02
      devices:
      - name: vdb
  resources:
    osd:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi
    mon:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    mgr:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
