apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/observability/victoria-metrics-k8s-stack
configMapGenerator:
- name: victoria-metrics-k8s-stack-cluster-values
  namespace: observability
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
