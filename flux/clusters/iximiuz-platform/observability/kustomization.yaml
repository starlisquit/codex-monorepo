apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/observability/victoria-metrics-k8s-stack
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: victoria-metrics-k8s-stack
  patch: |
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: victoria-metrics-k8s-stack-cluster-values
        valuesKey: values.yaml
configMapGenerator:
- name: victoria-metrics-k8s-stack-cluster-values
  namespace: observability
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
