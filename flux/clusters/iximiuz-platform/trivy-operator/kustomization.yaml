apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../security/trivy-operator
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: trivy-operator
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: trivy-operator
      namespace: trivy-system
    spec:
      suspend: false
      timeout: 15m
