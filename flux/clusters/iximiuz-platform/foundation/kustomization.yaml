apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespaces.yaml
- ../../../infrastructure/sources
patches:
- target:
    group: source.toolkit.fluxcd.io
    version: v1
    kind: HelmRepository
    name: cilium
  patch: "$patch: delete\napiVersion: source.toolkit.fluxcd.io/v1\nkind: HelmRepository\n\
    metadata:\n  name: cilium\n  namespace: flux-system\n"
