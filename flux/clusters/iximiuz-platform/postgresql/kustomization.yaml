apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/databases/cloudnative-pg/clusters/application
patches:
- target:
    kind: Cluster
    group: postgresql.cnpg.io
    name: application-db
  patch: |
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: application-db
      namespace: databases
    spec:
      storage:
        size: 1Gi
