apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ceph
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  path: ./flux/clusters/iximiuz-platform/ceph
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: rook-operator
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: rook-ceph-cluster
    namespace: rook-ceph
  - apiVersion: ceph.rook.io/v1
    kind: CephCluster
    name: rook-ceph
    namespace: rook-ceph
  - apiVersion: ceph.rook.io/v1
    kind: CephBlockPool
    name: ceph-blockpool
    namespace: rook-ceph
  healthCheckExprs:
  - apiVersion: ceph.rook.io/v1
    kind: CephCluster
    current: has(status.phase) && status.phase == 'Ready' && has(status.ceph) && status.ceph.health
      in ['HEALTH_OK', 'HEALTH_WARN']
  - apiVersion: ceph.rook.io/v1
    kind: CephBlockPool
    current: has(status.phase) && status.phase == 'Ready'
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  path: ./flux/clusters/iximiuz-platform/observability
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: storage-ready
  - name: grafana-operator
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: victoria-metrics-k8s-stack
    namespace: observability
  - apiVersion: apps/v1
    kind: Deployment
    name: victoria-metrics-k8s-stack-grafana
    namespace: observability
  - apiVersion: apps/v1
    kind: Deployment
    name: vmagent-victoria-metrics-k8s-stack
    namespace: observability
  - apiVersion: apps/v1
    kind: Deployment
    name: vmsingle-victoria-metrics-k8s-stack
    namespace: observability
  - apiVersion: apps/v1
    kind: Deployment
    name: vlsingle-victoria-metrics-k8s-stack
    namespace: observability
  - apiVersion: apps/v1
    kind: Deployment
    name: vtsingle-victoria-metrics-k8s-stack
    namespace: observability
  - apiVersion: apps/v1
    kind: StatefulSet
    name: vlagent-victoria-metrics-k8s-stack
    namespace: observability
  - apiVersion: apps/v1
    kind: StatefulSet
    name: vmalertmanager-victoria-metrics-k8s-stack
    namespace: observability
---
