apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  path: ./flux/clusters/iximiuz-platform/cilium
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: cilium
    namespace: kube-system
  dependsOn:
  - name: monitoring-crds
  - name: gateway-api
---
