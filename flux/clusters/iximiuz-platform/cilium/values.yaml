k8sServiceHost: 172.16.0.2
k8sServicePort: 6443
ipam:
  mode: kubernetes
operator:
  replicas: 1
gatewayAPI:
  enabled: true
hubble:
  tls:
    auto:
      method: certmanager
      certValidityDuration: 90
      certManagerIssuerRef:
        name: platform-workload-ca
        kind: ClusterIssuer
        group: cert-manager.io
tls:
  caBundle:
    enabled: true
    name: platform-ca
    key: ca.crt
    useSecret: false
