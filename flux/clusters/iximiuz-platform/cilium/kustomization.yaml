apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/networking/cilium
- source.yaml
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: cilium
  patch: "- op: replace\n  path: /spec/suspend\n  value: false\n- op: remove\n  path:\
    \ /spec/dependsOn\n- op: add\n  path: /spec/valuesFrom/-\n  value:\n    kind:\
    \ ConfigMap\n    name: cilium-cluster-values\n    valuesKey: values.yaml\n"
configMapGenerator:
- name: cilium-cluster-values
  namespace: kube-system
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
