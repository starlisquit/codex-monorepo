apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-openbao
  namespace: secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: openbao
  namespace: secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: secrets
spec:
  provider:
    vault:
      server: https://openbao-active.secrets.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: openbao-server-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-lab
          serviceAccountRef:
            name: external-secrets-openbao
            audiences:
            - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-verification
  namespace: secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: openbao-verification
  data:
  - secretKey: status
    remoteRef:
      key: lab/verification
      property: status
