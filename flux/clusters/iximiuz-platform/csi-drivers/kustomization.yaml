apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/storage/rook-ceph/csi-drivers
patches:
- target:
    kind: HelmRelease
    name: ceph-csi-drivers
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: ceph-csi-drivers
      namespace: rook-ceph
    spec:
      suspend: false
- target:
    kind: HelmRelease
    name: ceph-csi-drivers
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: ceph-csi-drivers
      namespace: rook-ceph
    spec:
      values:
        operatorConfig:
          driverSpecDefaults:
            controllerPlugin:
              replicas: 1
        drivers:
          cephfs:
            enabled: false
