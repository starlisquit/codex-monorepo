apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/certificates/trust-manager
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: trust-manager
  patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ trust-manager\n  namespace: certificates\nspec:\n  suspend: false\n  timeout:\
    \ 15m\n"
- target:
    kind: HelmRelease
    name: trust-manager
  patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ trust-manager\n  namespace: certificates\nspec:\n  values:\n    app:\n     \
    \ trust:\n        namespace: certificates\n"
