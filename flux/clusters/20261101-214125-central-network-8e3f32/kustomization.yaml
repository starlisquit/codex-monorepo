apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- flux-system
- infrastructure.yaml
- ../../infrastructure/certificates/pki/opt-in/flux
- ../../infrastructure/networking/cilium/opt-in/flux
- ../../infrastructure/databases/clickhouse/operator/opt-in/flux
- ../../infrastructure/databases/clickhouse/cluster/opt-in/flux
patches:
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: clickhouse-cluster
