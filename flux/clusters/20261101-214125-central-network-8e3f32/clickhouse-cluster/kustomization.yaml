apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/databases/clickhouse/cluster
patches:
- target:
    group: clickhouse.com
    kind: (ClickHouseCluster|KeeperCluster)
    name: clickhouse
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n- op: replace\n  path:\
    \ /spec/dataVolumeClaimSpec/storageClassName\n  value: local-path\n- op: replace\n\
    \  path: /spec/dataVolumeClaimSpec/resources/requests/storage\n  value: 1Gi\n"
