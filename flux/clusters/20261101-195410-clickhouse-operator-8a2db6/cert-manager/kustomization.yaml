apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/certificates/cert-manager
patches:
- target:
    kind: HelmRelease
    name: cert-manager
  patch: "- op: remove\n  path: /spec/dependsOn\n- op: add\n  path: /spec/values\n\
    \  value:\n    prometheus:\n      enabled: false\n      servicemonitor:\n    \
    \    enabled: false\n"
