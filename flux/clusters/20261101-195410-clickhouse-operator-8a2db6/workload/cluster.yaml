# Small, non-HA validation fixture only. Never a production sizing recommendation.
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: verification
spec:
  replicas: 1
  dataVolumeClaimSpec:
    storageClassName: local-path
    resources:
      requests:
        storage: 1Gi
---
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: verification
spec:
  replicas: 1
  dataVolumeClaimSpec:
    storageClassName: local-path
    resources:
      requests:
        storage: 1Gi
  keeperClusterRef:
    name: verification
