apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: applications
namePrefix: api-
resources:
- ../../../infrastructure/primitives/deployment
components:
- ../../../infrastructure/primitives/deployment/opt-in/servicemonitor
labels:
- pairs:
    app.kubernetes.io/name: api
  includeSelectors: true
  includeTemplates: true
patches:
- target:
    kind: Deployment
    name: application
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n- op: replace\n  path:\
    \ /spec/template/spec/containers/0/image\n  value: python:3.13.9-slim\n- op: add\n\
    \  path: /spec/template/spec/containers/0/command\n  value:\n  - python\n  - -c\n\
    \  - \"import http.server,threading,os\\nclass H(http.server.BaseHTTPRequestHandler):\\\
    n\\\n    \\ def do_GET(self):\\n  self.send_response(200);self.end_headers();self.wfile.write(('template_probe{app=\\\
    \"\\\n    %s\\\"} 1\\\\n'%os.environ['APP_ID']).encode())\\n def log_message(self,*args):pass\\\
    n\\\n    threading.Thread(target=http.server.ThreadingHTTPServer(('0.0.0.0',8081),H).serve_forever,daemon=True).start()\\\
    n\\\n    http.server.ThreadingHTTPServer(('0.0.0.0',8080),H).serve_forever()\\\
    n\"\n- op: replace\n  path: /spec/template/spec/containers/0/args\n  value: []\n\
    - op: add\n  path: /spec/template/spec/containers/0/env\n  value:\n  - name: APP_ID\n\
    \    value: api\n"
