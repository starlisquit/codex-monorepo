apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-fixture
  namespace: velero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-fixture
  template:
    metadata:
      labels:
        app: s3-fixture
    spec:
      containers:
      - name: s3-fixture
        image: docker.io/chrislusf/seaweedfs:4.00@sha256:dcbccdc9f33689d43ca3d1fb73d2baa319f8307c59d7923191b993ddc85ba6f8
        ports:
        - containerPort: 9000
        env: []
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        args:
        - server
        - -s3
        - -s3.port=9000
        - -s3.config=/etc/s3/config.json
        - -dir=/data
        - -volume.max=16
        - -master.volumeSizeLimitMB=10
        volumeMounts:
        - name: data
          mountPath: /data
        - name: s3-config
          mountPath: /etc/s3
          readOnly: true
        startupProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 2
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 2
      volumes:
      - name: data
        emptyDir: {}
      - name: s3-config
        secret:
          secretName: s3-fixture
          items:
          - key: config.json
            path: config.json
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: s3-fixture
  namespace: velero
spec:
  selector:
    app: s3-fixture
  ports:
  - port: 9000
    targetPort: 9000
