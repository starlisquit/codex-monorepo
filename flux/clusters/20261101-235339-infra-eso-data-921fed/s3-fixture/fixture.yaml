apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-fixture
  namespace: velero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-fixture
  template:
    metadata:
      labels:
        app: s3-fixture
    spec:
      containers:
      - name: s3-fixture
        image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
        ports:
        - containerPort: 9000
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: s3-fixture
              key: access-key
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: s3-fixture
              key: secret-key
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        args:
        - server
        - /data
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: s3-fixture
  namespace: velero
spec:
  selector:
    app: s3-fixture
  ports:
  - port: 9000
    targetPort: 9000
