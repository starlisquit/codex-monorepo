apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/quality/sonarqube/opt-in/postgresql
patches:
- target:
    kind: Cluster
    name: sonarqube-postgresql
  patch: |
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: sonarqube-postgresql
      namespace: quality
    spec:
      storage:
        storageClass: local-path
        size: 1Gi
