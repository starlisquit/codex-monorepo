apiVersion: batch/v1
kind: Job
metadata:
  name: sonarqube-cnpg-analysis
  namespace: quality
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: node-01
      automountServiceAccountToken: false
      containers:
      - name: scanner
        image: sonarsource/sonar-scanner-cli@sha256:47956b669bf486bdad919e1cbd0533223515aa0b6d1d31763e5a3754942df6d7
        command:
        - sh
        - -ec
        args:
        - 'mkdir -p /tmp/analysis && cd /tmp/analysis

          printf "def add(left, right):\n    return left + right\n\nprint(add(1, 2))\n"
          > example.py

          sonar-scanner -Dsonar.projectKey=sonar-cnpg-validation -Dsonar.sources=.
          -Dsonar.python.version=3.12

          cat .scannerwork/report-task.txt > /dev/termination-log

          '
        env:
        - name: SONAR_HOST_URL
          value: http://sonarqube-sonarqube.quality.svc.cluster.local:9000
        - name: SONAR_TOKEN
          valueFrom:
            secretKeyRef:
              name: sonarqube-validation-token
              key: token
        - name: SONAR_USER_HOME
          value: /tmp/sonar-cache
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
