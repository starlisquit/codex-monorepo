apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/databases/cloudnative-pg/operator
patches:
- target:
    kind: HelmRelease
    name: cloudnative-pg-operator
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: cloudnative-pg-operator
      namespace: databases
    spec:
      dependsOn: null
      values:
        monitoring:
          podMonitorEnabled: false
