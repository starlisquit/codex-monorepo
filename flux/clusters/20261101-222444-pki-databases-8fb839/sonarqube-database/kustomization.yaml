apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/quality/sonarqube/opt-in/postgresql
patches:
- target:
    kind: Cluster
    name: sonarqube-postgresql
  patch: "- op: replace\n  path: /spec/instances\n  value: 2\n- op: replace\n  path:\
    \ /spec/storage/storageClass\n  value: local-path\n- op: replace\n  path: /spec/storage/size\n\
    \  value: 1Gi\n"
