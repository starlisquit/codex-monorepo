k8sServiceHost: 172.16.0.2
k8sServicePort: 6443
encryption:
  enabled: false
gatewayAPI:
  enabled: false
operator:
  replicas: 1
hubble:
  ui:
    enabled: false
  relay:
    tls:
      server:
        enabled: true
        mtls: true
        extraDnsNames:
        - hubble-relay.kube-system.svc
        - localhost
        extraIpAddresses:
        - 127.0.0.1
