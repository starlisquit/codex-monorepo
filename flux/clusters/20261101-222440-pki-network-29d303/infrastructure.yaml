apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-222440-pki-network-29d303/foundation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-crds
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-222440-pki-network-29d303/monitoring-crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: foundation
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: prometheus-operator-crds
    namespace: observability
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-222440-pki-network-29d303/cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: monitoring-crds
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: cert-manager
    namespace: certificates
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pki-issuer
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-222440-pki-network-29d303/pki-issuer
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: cert-manager
  healthChecks:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    namespace: certificates
    name: platform-root
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    name: platform-workload-ca
  healthCheckExprs:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready'
      && c.status == 'True')
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready'
      && c.status == 'True')
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trust-manager
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-222440-pki-network-29d303/trust-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: pki-issuer
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: trust-manager
    namespace: certificates
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pki-trust
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-222440-pki-network-29d303/pki-trust
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: trust-manager
  healthChecks:
  - apiVersion: trust.cert-manager.io/v1alpha1
    kind: Bundle
    name: platform-ca
  healthCheckExprs:
  - apiVersion: trust.cert-manager.io/v1alpha1
    kind: Bundle
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Synced'
      && c.status == 'True')
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-222440-pki-network-29d303/cilium
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: pki-trust
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: cilium
    namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clickhouse-operator
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-222440-pki-network-29d303/clickhouse-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  dependsOn:
  - name: pki-trust
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: clickhouse-operator
    namespace: databases
