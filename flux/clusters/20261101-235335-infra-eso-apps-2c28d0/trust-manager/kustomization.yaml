apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/certificates/trust-manager
configMapGenerator:
- name: trust-manager-cluster-values
  namespace: certificates
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
patches:
- target:
    kind: HelmRelease
    name: trust-manager
  patch: "- op: replace\n  path: /spec/dependsOn\n  value:\n  - name: cert-manager\n\
    \    namespace: certificates\n"
