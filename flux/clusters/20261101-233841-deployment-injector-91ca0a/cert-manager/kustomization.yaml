apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/certificates/cert-manager
configMapGenerator:
- name: cert-manager-cluster-values
  namespace: certificates
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
patches:
- target:
    kind: HelmRelease
    name: cert-manager
  patch: "- op: replace\n  path: /spec/dependsOn\n  value: []\n"
