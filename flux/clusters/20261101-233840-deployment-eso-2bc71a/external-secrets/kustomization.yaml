apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/secrets/external-secrets
configMapGenerator:
- name: external-secrets-cluster-values
  namespace: secrets
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
patches:
- target:
    kind: HelmRelease
    name: external-secrets
  patch: "- op: replace\n  path: /spec/dependsOn\n  value:\n  - name: cert-manager\n\
    \    namespace: certificates\n"
