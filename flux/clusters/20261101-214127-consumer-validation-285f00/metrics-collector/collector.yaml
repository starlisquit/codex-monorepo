apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: validation
  namespace: ${OBSERVABILITY_NAMESPACE:=observability}
spec:
  retentionPeriod: 1d
  port: '8428'
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  extraArgs:
    memory.allowedPercent: '60'
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: validation
  namespace: ${OBSERVABILITY_NAMESPACE:=observability}
spec:
  selectAllByDefault: true
  scrapeInterval: 10s
  remoteWrite:
  - url: http://vmsingle-validation.${OBSERVABILITY_NAMESPACE:=observability}.svc:8428/api/v1/write
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi
