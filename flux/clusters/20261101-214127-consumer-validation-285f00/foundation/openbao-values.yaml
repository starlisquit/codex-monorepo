apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-cluster-values
  namespace: ${SECRETS_NAMESPACE:=secrets}
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: "server:\n  ha:\n    replicas: 1\n  dataStorage:\n    storageClass:\
    \ local-path\n    size: 1Gi\n  resources:\n    requests:\n      cpu: 100m\n  \
    \    memory: 128Mi\n    limits:\n      memory: 512Mi\n"
