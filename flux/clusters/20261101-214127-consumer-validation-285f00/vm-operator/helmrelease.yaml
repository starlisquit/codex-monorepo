apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: validation-vm-operator
  namespace: ${OBSERVABILITY_NAMESPACE:=observability}
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: victoria-metrics-operator
      version: 0.68.1
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  values:
    operator:
      disable_prometheus_converter: false
    admissionWebhooks:
      certManager:
        enabled: true
        issuer:
          name: ${CA_ISSUER_NAME}
          kind: ClusterIssuer
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
