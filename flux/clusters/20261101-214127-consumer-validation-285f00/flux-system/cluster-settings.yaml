apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  CLUSTER_NAME: consumer-validation
  CA_CERT_NAME: consumer-root-key
  CA_ISSUER_NAME: consumer-workload-ca
  CA_BUNDLE_NAME: consumer-ca
  CA_COMMON_NAME: Consumer Validation Root
  CERTIFICATES_NAMESPACE: consumer-pki
  OBSERVABILITY_NAMESPACE: consumer-metrics
  SECRETS_NAMESPACE: application-secrets
  OPENBAO_AUTH_ROLE: consumer-reader
  OPENBAO_AUTH_MOUNT: kubernetes
  OPENBAO_KV_MOUNT: kv
