apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../infrastructure/primitives/cronjob
namespace: demo
namePrefix: scheduled-
patches:
- target:
    kind: CronJob
  patch: "- op: replace\n  path: /spec/schedule\n  value: '* * * * *'\n- op: replace\n\
    \  path: /spec/jobTemplate/spec/template/spec/containers/0/command\n  value:\n\
    \  - /bin/sh\n  - -ec\n  - date -Iseconds; sleep 75; echo scheduled-runtime-ok\n"
