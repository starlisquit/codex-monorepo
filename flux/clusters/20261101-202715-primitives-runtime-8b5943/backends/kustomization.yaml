apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/primitives/deployment
namespace: demo
components:
- ../../../infrastructure/primitives/deployment/opt-in/service
replicas:
- name: application
  count: 1
configMapGenerator:
- name: protocol-fixture
  files:
  - server.py
  - client.py
patches:
- path: deployment-patch.yaml
- target:
    kind: Deployment
    name: application
  patch: "- op: replace\n  path: /spec/template/spec/containers/0/args\n  value: []\n"
- target:
    kind: Service
    name: application
  patch: "- op: replace\n  path: /spec/ports\n  value:\n  - name: http\n    port:\
    \ 80\n    targetPort: 8080\n  - appProtocol: kubernetes.io/h2c\n    name: grpc\n\
    \    port: 50051\n    targetPort: 50051\n  - name: tls\n    port: 8443\n    targetPort:\
    \ 8443\n  - name: tcp\n    port: 5432\n    targetPort: 5432\n  - name: udp\n \
    \   port: 5353\n    protocol: UDP\n    targetPort: 5353\n"
