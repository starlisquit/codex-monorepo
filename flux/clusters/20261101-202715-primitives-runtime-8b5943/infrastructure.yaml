apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-202715-primitives-runtime-8b5943/foundation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-controller
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-202715-primitives-runtime-8b5943/controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
  - name: foundation
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: validation-envoy-gateway
    namespace: proxy
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-class
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
