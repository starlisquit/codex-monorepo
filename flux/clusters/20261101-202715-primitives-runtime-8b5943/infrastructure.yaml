    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
  - name: foundation
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: application
    namespace: demo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-routes
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  path: ./flux/clusters/20261101-202715-primitives-runtime-8b5943/routes
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
