apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: validation-envoy-gateway
  namespace: proxy
spec:
  interval: 5m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: validation-envoy-gateway
    namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 2
  upgrade:
    crds: Skip
  values:
    deployment:
      replicas: 1
    config:
      envoyGateway:
        provider:
          type: Kubernetes
