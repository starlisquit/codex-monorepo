apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../infrastructure/secrets/openbao
configMapGenerator:
- name: openbao-cluster-values
  namespace: ${NS_SECRETS}
  files:
  - values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
