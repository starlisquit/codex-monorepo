kind: playground
name: codex-platform-243e14fd
base: k8s-omni
title: Codex full platform with Ceph
description: Ceph-backed platform lab; control plane sized above workers, with dedicated
  raw OSD disks.
categories:
- kubernetes
playground:
  networks:
  - name: local
    subnet: 172.16.0.0/24
  machines:
  - name: dev-machine
    users:
    - name: root
    - name: laborant
      default: true
    drives:
    - source: k8s-omni-dev-machine
      mount: /
      size: 10GiB
    network:
      interfaces:
      - network: local
        address: 172.16.0.5/24
    resources:
      cpuCount: 1
      ramSize: 1GiB
  - name: cplane-01
    users:
    - name: root
    - name: laborant
      default: true
    drives:
    - source: k8s-omni-cplane
      mount: /
      size: 20GiB
    - size: 25GiB
    network:
      interfaces:
      - network: local
        address: 172.16.0.2/24
    resources:
      cpuCount: 4
      ramSize: 6GiB
  - name: node-01
    users:
    - name: root
    - name: laborant
      default: true
    drives:
    - source: k8s-omni-node
      mount: /
      size: 20GiB
    - size: 25GiB
    network:
      interfaces:
      - network: local
        address: 172.16.0.3/24
    resources:
      cpuCount: 2
      ramSize: 4608MiB
  - name: node-02
    users:
    - name: root
    - name: laborant
      default: true
    drives:
    - source: k8s-omni-node
      mount: /
      size: 20GiB
    - size: 25GiB
    network:
      interfaces:
      - network: local
        address: 172.16.0.4/24
    resources:
      cpuCount: 2
      ramSize: 4608MiB
  tabs:
  - id: ide-dev-machine
    kind: ide
    name: IDE
    machine: dev-machine
    enabled: true
  - id: kexp-dev-machine
    kind: kexp
    name: Explorer
    machine: dev-machine
    enabled: true
  - id: terminal-dev-machine
    kind: terminal
    name: dev-machine
    machine: dev-machine
    enabled: true
  - id: terminal-cplane-01
    kind: terminal
    name: cplane-01
    machine: cplane-01
    enabled: true
  - id: terminal-node-01
    kind: terminal
    name: node-01
    machine: node-01
    enabled: true
  - id: terminal-node-02
    kind: terminal
    name: node-02
    machine: node-02
    enabled: true
  initTasks:
    init_cplane_00_configure_cni:
      name: init_cplane_00_configure_cni
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      run: "cat > /etc/cni/net.d/99-loopback.conf <<EOF\n{\n  \"cniVersion\": \"1.1.0\"\
        ,\n  \"name\": \"lo\",\n  \"type\": \"loopback\"\n}\nEOF\n\ncat > /etc/cni/net.d/10-bridge.conf\
        \ <<EOF\n{\n  \"cniVersion\": \"1.0.0\",\n  \"name\": \"bridge\",\n  \"type\"\
        : \"bridge\",\n  \"bridge\": \"cni0\",\n  \"isGateway\": true,\n  \"ipMasq\"\
        : true,\n  \"ipam\": {\n    \"type\": \"host-local\",\n    \"ranges\": [\n\
        \      [{\"subnet\": \"10.244.0.0/24\"}]\n    ],\n    \"routes\": [{\"dst\"\
        : \"0.0.0.0/0\"}]\n  }\n}\nEOF"
      conditions:
      - key: Networking plugin
        value: static
    init_cplane_00_configure_routes:
      name: init_cplane_00_configure_routes
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      run: 'ip route add 10.244.1.0/24 via 172.16.0.3  # node-01

        ip route add 10.244.2.0/24 via 172.16.0.4  # node-02'
      conditions:
      - key: Networking plugin
        value: static
    init_cplane_10_containerd_install:
      name: init_cplane_10_containerd_install
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_cplane_00_configure_cni
      - init_cplane_00_configure_routes
      run: "mv /opt/iximiuz-labs/containerd/containerd.service /etc/systemd/system/containerd.service\n\
        \nchmod +x /opt/iximiuz-labs/containerd/bin/*\nmv /opt/iximiuz-labs/containerd/bin/*\
        \ /usr/local/bin\n\nmkdir -p /etc/containerd\ncat <<EOF > /etc/containerd/config.toml\n\
        version = 2\n\n[plugins.\"io.containerd.grpc.v1.cri\"]\n  [plugins.\"io.containerd.grpc.v1.cri\"\
        .containerd]\n    snapshotter = \"overlayfs\"\n    default_runtime_name =\
        \ \"runc\"\n  [plugins.\"io.containerd.grpc.v1.cri\".containerd.runtimes.runc]\n\
        \    runtime_type = \"io.containerd.runc.v2\"\n  [plugins.\"io.containerd.grpc.v1.cri\"\
        .containerd.runtimes.runc.options]\n    SystemdCgroup = true\n[plugins.\"\
        io.containerd.grpc.v1.cri\".cni]\n  bin_dir = \"/opt/cni/bin\"\n  conf_dir\
        \ = \"/etc/cni/net.d\"\nEOF\n\nsystemctl daemon-reload\nsystemctl enable --now\
        \ containerd"
      conditions:
      - key: Container runtime
        value: containerd
    init_cplane_10_cri_o_install:
      name: init_cplane_10_cri_o_install
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_cplane_00_configure_cni
      - init_cplane_00_configure_routes
      run: 'apt-get update

        cp -r /opt/iximiuz-labs/apt-cache/* /var/cache/apt/archives/

        apt-get install -y cri-o podman


        systemctl daemon-reload

        systemctl enable --now crio'
      conditions:
      - key: Container runtime
        value: cri-o
    init_cplane_15_containerd_load_images:
      name: init_cplane_15_containerd_load_images
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_cplane_10_containerd_install
      run: "for i in $(ls /opt/iximiuz-labs/images); do\n  ctr -n k8s.io images import\
        \ \"/opt/iximiuz-labs/images/$i\"\ndone\n\nrm -rf /opt/iximiuz-labs/images"
      conditions:
      - key: Container runtime
        value: containerd
    init_cplane_15_cri_o_load_images:
      name: init_cplane_15_cri_o_load_images
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_cplane_10_cri_o_install
      run: "for i in $(ls /opt/iximiuz-labs/images); do\n  podman load -i \"/opt/iximiuz-labs/images/$i\"\
        \ndone\n\nrm -rf /opt/iximiuz-labs/images"
      conditions:
      - key: Container runtime
        value: cri-o
    init_cplane_20_kubeadm_init:
      name: init_cplane_20_kubeadm_init
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_cplane_15_containerd_load_images
      - init_cplane_15_cri_o_load_images
      run: kubeadm init --pod-network-cidr=10.244.0.0/16 --skip-phases=addon/kube-proxy
    init_cplane_30_place_kubeconfig:
      name: init_cplane_30_place_kubeconfig
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_cplane_20_kubeadm_init
      run: 'mkdir /root/.kube

        ln -s /etc/kubernetes/admin.conf /root/.kube/config


        mkdir /home/laborant/.kube

        cp /etc/kubernetes/admin.conf /home/laborant/.kube/config

        chown -R laborant:laborant /home/laborant/.kube'
    init_cplane_40_taint:
      name: init_cplane_40_taint
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_cplane_30_place_kubeconfig
      run: kubectl taint node cplane-01 node-role.kubernetes.io/control-plane:NoSchedule-
    init_cplane_50_calico_crds:
      name: init_cplane_50_calico_crds
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_cplane_50_calico_operator
      run: 'curl -s https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/custom-resources.yaml
        | \

        yq eval ''select(.kind == "Installation") | .spec.calicoNetwork.ipPools[]
        |= (.cidr = "10.244.0.0/16")'' - | \

        kubectl apply -f -


        curl -s https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/custom-resources.yaml
        | \

        yq eval ''select(.kind != "Installation")'' - | \

        kubectl apply -f -'
      conditions:
      - key: Networking plugin
        value: calico
    init_cplane_50_calico_operator:
      name: init_cplane_50_calico_operator
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_cplane_40_taint
      run: 'kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/tigera-operator.yaml                '
      conditions:
      - key: Networking plugin
        value: calico
    init_cplane_50_cilium:
      name: init_cplane_50_cilium
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_cplane_40_taint
      run: 'CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)

        CLI_ARCH=amd64

        if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi


        curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}

        sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum

        tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin

        rm cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}


        cilium install'
      conditions:
      - key: Networking plugin
        value: cilium
    init_cplane_50_flannel:
      name: init_cplane_50_flannel
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_cplane_40_taint
      run: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      conditions:
      - key: Networking plugin
        value: flannel
    init_dev_machine_10_place_kubeconfig:
      name: init_dev_machine_10_place_kubeconfig
      machine: dev-machine
      init: true
      user: root
      timeout_seconds: 300
      run: 'mkdir -p /root/.kube

        scp -o StrictHostKeyChecking=no cplane-01:/etc/kubernetes/admin.conf /root/.kube/config


        mkdir -p /home/laborant/.kube

        cp /root/.kube/config /home/laborant/.kube/config

        chown -R laborant:laborant /home/laborant/.kube'
    init_dev_machine_20_install_calicoctl:
      name: init_dev_machine_20_install_calicoctl
      machine: dev-machine
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_dev_machine_10_place_kubeconfig
      run: 'curl -L https://github.com/projectcalico/calico/releases/download/v3.29.1/calicoctl-linux-amd64
        -o /usr/local/bin/calicoctl

        chmod +x /usr/local/bin/calicoctl


        curl -L https://github.com/projectcalico/calico/releases/download/v3.29.1/calicoctl-linux-amd64
        -o /usr/local/bin/kubectl-calico

        chmod +x /usr/local/bin/kubectl-calico'
      conditions:
      - key: Networking plugin
        value: calico
    init_dev_machine_20_install_cilium:
      name: init_dev_machine_20_install_cilium
      machine: dev-machine
      init: true
      user: root
      timeout_seconds: 300
      needs:
      - init_dev_machine_10_place_kubeconfig
      run: 'CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)

        CLI_ARCH=amd64

        if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi


        curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}

        sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum

        tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin

        rm cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}'
      conditions:
      - key: Networking plugin
        value: cilium
