      run: "cat > /etc/cni/net.d/99-loopback.conf <<EOF\n{\n  \"cniVersion\": \"1.1.0\"\
        ,\n  \"name\": \"lo\",\n  \"type\": \"loopback\"\n}\nEOF\n\ncat > /etc/cni/net.d/10-bridge.conf\
        \ <<EOF\n{\n  \"cniVersion\": \"1.0.0\",\n  \"name\": \"bridge\",\n  \"type\"\
        : \"bridge\",\n  \"bridge\": \"cni0\",\n  \"isGateway\": true,\n  \"ipMasq\"\
        : true,\n  \"ipam\": {\n    \"type\": \"host-local\",\n    \"ranges\": [\n\
        \      [{\"subnet\": \"10.244.1.0/24\"}]\n    ],\n    \"routes\": [{\"dst\"\
        : \"0.0.0.0/0\"}]\n  }\n}\nEOF"
      conditions:
