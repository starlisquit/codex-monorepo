apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  CLUSTER_NAME: example
  CA_CERT_NAME: platform-root-ca
  CA_ISSUER_NAME: platform-workload-ca
  CA_BUNDLE_NAME: platform-ca
  CA_COMMON_NAME: Example Platform Root CA
  OBSERVABILITY_NAMESPACE: observability
  CERTIFICATES_NAMESPACE: certificates
  OPENBAO_AUTH_ROLE: external-secrets
  GITLAB_URL: https://gitlab.example.com/
  RENOVATE_PLATFORM: gitlab
  RENOVATE_ENDPOINT: https://gitlab.example.com/api/v4/
  RENOVATE_REPOSITORIES: '["example/platform"]'
