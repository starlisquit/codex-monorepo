# Disposable OpenAI-compatible fixture, not a model inference deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-openai-code
  namespace: ai
data:
  server.py: |
    import json, os, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *_):
            pass
        def do_GET(self):
            self.send_response(200 if self.path == '/health' else 404)
            self.end_headers()
        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers.get('Content-Length', 0))))
            authorized = self.headers.get('Authorization') == 'Bearer ' + os.environ['MOCK_KEY']
            print(json.dumps({'path': self.path, 'model': body.get('model'),
                              'stream': body.get('stream', False), 'authorized': authorized}), flush=True)
            if not authorized or not self.path.endswith('/chat/completions'):
                self.send_response(401 if not authorized else 404)
                self.end_headers()
                return
            if body.get('stream'):
                self.send_response(200)
                self.send_header('Content-Type', 'text/event-stream')
                self.send_header('Connection', 'close')
                self.end_headers()
                for content in ['proxy-', 'route-verified']:
                    chunk = {'id': 'chatcmpl-validation', 'object': 'chat.completion.chunk',
                             'created': int(time.time()), 'model': body['model'],
                             'choices': [{'index': 0, 'delta': {'content': content}, 'finish_reason': None}]}
                    self.wfile.write(('data: ' + json.dumps(chunk) + '\n\n').encode())
                    self.wfile.flush()
                    time.sleep(.5)
                self.wfile.write(b'data: [DONE]\n\n')
                self.wfile.flush()
            else:
                response = {'id': 'chatcmpl-validation', 'object': 'chat.completion',
                            'created': int(time.time()), 'model': body['model'],
                            'choices': [{'index': 0, 'message': {'role': 'assistant', 'content': 'proxy-route-verified'},
                                         'finish_reason': 'stop'}],
                            'usage': {'prompt_tokens': 2, 'completion_tokens': 3, 'total_tokens': 5}}
                raw = json.dumps(response).encode()
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(raw)))
                self.end_headers()
                self.wfile.write(raw)
    ThreadingHTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-openai
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-openai
  template:
    metadata:
      labels:
        app: mock-openai
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: node-01
      containers:
      - name: mock
        image: docker.io/library/python:3.12-alpine
        command: [python, /app/server.py]
        env:
        - name: MOCK_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-provider-credentials
              key: OPENAI_API_KEY
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: mock-openai-code
---
apiVersion: v1
kind: Service
metadata:
  name: mock-openai
  namespace: ai
spec:
  selector:
    app: mock-openai
  ports:
  - port: 8080
    targetPort: 8080
