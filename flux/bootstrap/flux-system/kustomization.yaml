apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
patches:
- target:
    kind: Deployment
    name: kustomize-controller
  patch: "- op: add\n  path: /spec/template/spec/containers/0/args/-\n  value: --feature-gates=StrictPostBuildSubstitutions=true\n"
commonAnnotations:
  kustomize.toolkit.fluxcd.io/substitute: disabled
